ZAT_celestial_balance_decision_guidesc: "From the capital of §7Astra-Khor§! to the §GVel’Soran§! plains, our §YCentaur§! heartland must lead the way. Yet, the §YMinotaur§! forges of the §0Dhorrak Highlands§! and the §YHarpy§! aeries of §1Sireth Cove§! provide the steel and sight our nation requires. As relations with §YHuman§! trade-hubs on the §9Mundus Shore§! shift and §YCentaur§! amalgamation grows in §GKeth Maraan§!, we must balance these powers to ensure the §4celestial alignment§! of all §Yfour species§! remains unbroken."
