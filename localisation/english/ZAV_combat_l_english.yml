 ##################
 # COMBAT ACTIONS #
 ##################

 # Creating a combat action requires you to add a name for the action as ZAV_combat_action_title_[id] and
 # its effect as ZAV_combat_action_effect_[id]. Then loc must be done for success and failure. Then an
 # icon must be added in a .gfx file with the format GFX_ZAV_combat_action_[id]. Lastly, the wyrd cost
 # must be defined at the bottom of ZAV_combat_player_scripted_effects.txt and in the same file, the
 # effect of the action must also be defined.

 ZAV_combat_action_effect_inflicted:0 "Inflicted [?ZAV_combat_log_stats^entry_index] [GetCombatStatusEffectLogName]."
 ZAV_combat_action_effect_gained:0 "Gained [?ZAV_combat_log_stats^entry_index] [GetCombatStatusEffectLogName]."

 ZAV_combat_action_title_1:0 "Single Shot"
 ZAV_combat_action_effect_1:0 "§YHit chance§!: §L80%§!\n\n§YEffect§!:\n§R+5 damage§!"
 ZAV_combat_action_successful_1:0 "Fired a single shot with a pistol dealing §R[?ZAV_combat_log_stats^entry_index] damage§!."
 ZAV_combat_action_failure_1:0 "Fired a single shot with a pistol and §Ymissed§!."
 ZAV_combat_action_title_2:0 "Prayer"
 ZAV_combat_action_effect_2:0 "§YEffect§!:\n§C+4 wyrd§!"
 ZAV_combat_action_successful_2:0 "Prayed to a higher being and received §C[?ZAV_combat_log_stats^entry_index] wyrd§!."
 ZAV_combat_action_title_3:0 "Heal"
 ZAV_combat_action_effect_3:0 "§YEffect§!:\n§G+10 health§!"
 ZAV_combat_action_successful_3:0 "Healed using §C6 wyrd§! to receive §G[?ZAV_combat_log_stats^entry_index] health§!."
 ZAV_combat_action_title_4:0 "Barrage"
 ZAV_combat_action_effect_4:0 "§YHit chance§!: §L100%§!\n\n§YEffect§!:\n§R+12 damage§!\n§R20% chance to inflict 1 bleeding§R"
 ZAV_combat_action_successful_4:0 "Fired a barrage with a pistol dealing §R[?ZAV_combat_log_stats^entry_index] damage§!."

 ##################
 # COMBAT ENEMIES #
