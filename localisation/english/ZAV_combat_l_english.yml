 # Creating an enemy can be complicated but to start, you must define a name as ZAV_combat_enemy_[id].
 # Afterwards, you must add a GFX_ZAV_combat_enemy_image_[id] in a .gfx file. Then, you must define its
 # data and attacks in ZAV_combat_enemy_scripted_effects.txt. Lastly, each action must be given loc such
 # as below.

