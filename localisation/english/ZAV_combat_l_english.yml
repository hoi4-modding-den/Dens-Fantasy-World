 #########################
 # COMBAT STATUS EFFECTS #
 #########################

 # To create a new status effect, you need to first add a name and full loc key with its effects,
 # then create and add a GFX_ZAV_combat_status_effect_[id] file in a .gfx file, and finally in
 # ZAV_combat_status_effects_scripted_effects.txt, you must add the effect that it has on the game

 ZAV_combat_status_effect_tt:0 "[GetCombatStatusEffectFullDesc]"
 ZAV_combat_status_effect_duration_text:0 "[?ZAV_combat_player_status_effects_amounts^entry_index]"
 ZAV_combat_status_effect_enemy_duration_text:0 "[?ZAV_combat_enemy_status_effects_amounts^entry_index]"

 ZAV_combat_status_effect_1:0 "§7Decay§!"
 ZAV_combat_status_effect_1_full:0 "§7Decay§!\n\n§YEffect§!:\n§R-2 health per turn\n-50% health from healing§!"
 ZAV_combat_status_effect_2:0 "§0Madness§!"
 ZAV_combat_status_effect_2_full:0 "§0Madness§!\n\n§YEffect§!:\n§R-2 wyrd per turn§!"
