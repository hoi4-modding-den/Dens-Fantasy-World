 ZAV_combat_enemy_1_voice_line_1:0 "\"KRRRRAAH- I'm so hungry... so hungry!\""
 ZAV_combat_enemy_1_voice_line_2:0 "\"The bells... the chapel bells... make them stop ringing.\""
 ZAV_combat_enemy_1_voice_line_3:0 "\"Still warm... still breathing...\""
 ZAV_combat_enemy_1_voice_line_4:0 "*shrill screech*"
 ZAV_combat_enemy_1_voice_line_5:0 "\"RRRRGHHH-\""
 ZAV_combat_enemy_1_voice_line_6:0 "\"…GRAAAAHH!\""
 ZAV_combat_enemy_1_voice_line_7:0 "*growls*"
 ZAV_combat_enemy_1_lose:0 "\"So cold...\""
 ZAV_combat_enemy_1_win:0 "\"Easy prey...\""

 ZAV_combat_enemy_2:0 "Sir Carian Grimsby"
 ZAV_combat_enemy_2_voice_line_1:0 "\"Have you no fight left?\""
 ZAV_combat_enemy_2_voice_line_2:0 "\"Pathetic.\""
 ZAV_combat_enemy_2_voice_line_3:0 "\"I've seen much better.\""
 ZAV_combat_enemy_2_voice_line_4:0 "\"Is this a joke to you?\""
 ZAV_combat_enemy_2_lose:0 "\"You are nothing.\""
 ZAV_combat_enemy_2_win:0 "\"So weak... so pitiful...\""

 ZAV_combat_enemy_3:0 "Brother Narius"
 ZAV_combat_enemy_3_voice_line_1:0 "\"You are a unworthy of my Queen.\""
 ZAV_combat_enemy_3_voice_line_2:0 "\"I will open you mind.\""
 ZAV_combat_enemy_3_voice_line_3:0 "\"There is no escape from the order.\""
 ZAV_combat_enemy_3_voice_line_4:0 "*prays to the Shrouded Queen*"
 ZAV_combat_enemy_3_voice_line_5:0 "\"To know all is to lose all.\""
 ZAV_combat_enemy_3_voice_line_6:0 "\"You are but a hinderance to progress.\""
 ZAV_combat_enemy_3_lose:0 "\"You have not won. There is always another...\""
 ZAV_combat_enemy_3_win:0 "\"It is as my Queen wills it.\""

 ZAV_combat_enemy_4:0 "Arthur Fisher"
 ZAV_combat_enemy_4_voice_line_1:0 "\"Give in to the Goddess's love.\""
 ZAV_combat_enemy_4_voice_line_2:0 "\"Do not resist her call...\""
 ZAV_combat_enemy_4_voice_line_3:0 "\"Through decay, we are reborn...\""
 ZAV_combat_enemy_4_voice_line_4:0 "\"I will make you understand.\""
 ZAV_combat_enemy_4_voice_line_5:0 "*prays to the Crimson Goddess*"
 ZAV_combat_enemy_4_voice_line_6:0 "\"I will be reborn!\""
 ZAV_combat_enemy_4_lose:0 "\"Curse you Thorne...\""
 ZAV_combat_enemy_4_win:0 "\"The Great Corruption always triumphs.\""

