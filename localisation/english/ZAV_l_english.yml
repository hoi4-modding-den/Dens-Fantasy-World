 ZAV_information_events.1.t:0 "The Divine Saviours and the True King"
 ZAV_information_events.1.d:0 "The Divine Saviours are a secret organisation that is notorious for its increasingly violent and profane activities. While other secret organisations attempt to cover up traces of their activity, the saviours leave unmistakable marks in their wake. They are involved in ritualistic slaughter and defilement as well as spreading corruption in the bowels of our cities. Towns and cities have reported sudden disappearances, desecrated holy sites, and the emergence of twisted practices that defy law and tradition.\n\nThe saviours worship a deity known as the True King, who in prayer is claimed to one day rise and reclaim dominion over Avalon. Apostles of the True King view their actions not as crimes, but as necessary steps in preparing the realm for his wonderous return. Their acts of violence and corruption are framed as acts of devotion in purging weakness and reshaping society in His image.\n\nThe movement has found support among elements of the nobility. Disillusioned lords and ambitious elites have quietly aligned themselves with the Divine Saviours and provide resources, protection, and influence. This organisation is no longer a fringe sect but an organised and dangerous force whose influence corrupts the very heart of Avalon."
 ZAV_information_events.1.a:0 "..."

 ZAV_information_events.2.t:0 ""
 ZAV_information_events.2.d:0 ""
 ZAV_information_events.2.a:0 ""

 ZAV_divine_saviours_events.1.t:0 "Theft at the Blackridge Estate"
 ZAV_divine_saviours_events.1.d:0 "The estate of Lord Halvyr Blackridge, situated on the outskirts of Port Elisabeth, has been breached. No servants were harmed, and no signs of forced entry were recorded.\n\nOnly a single item appears to have been taken: a small, antiquated talisman kept within the lord's private study. Its exact function is unknown, though the Brackenridge family records suggest it predates even the current dynasty. The precision of the theft has raised concern among local authorities."
 ZAV_divine_saviours_events.1.a:0 "..."

 ZAV_divine_saviours_events.2.t:0 "On Investigating Blackridge Estate"
 ZAV_divine_saviours_events.2.d:0 "The assigned investigator reports that the intruders bypassed all valuables, targeting only the talisman. The study shows no signs of struggle, suggesting either cooperation or incapacitation without resistance. A servant recalls hearing whispers during the night, though no intruders were seen. The air within the study is described as “oppressively still,” even hours after the incident. The investigator believes the object itself may be of greater significance than previously understood."
 ZAV_divine_saviours_events.2.a:0 "The servants know more than they are letting on."
 ZAV_divine_saviours_events.2.b:0 "Let's explore our other avenues."

 ZAV_divine_saviours_events.3.t:0 "Interrogating the Staff"
 ZAV_divine_saviours_events.3.d:0 "Under the influence of the Corrupted Rose, the household staff quickly broke. One among them confessed to aiding the intruders, describing figures cloaked in ritual garb who spoke of 'clarity beyond the veil.' The talisman, they claim, was necessary 'to endure what is to come.' Cross-referenced symbols found within the study match markings previously linked to a known heretical sect."
 ZAV_divine_saviours_events.3.a:0 "..."

 ZAV_divine_saviours_events.4.t:0 "A Careless Whisper"
 ZAV_divine_saviours_events.4.d:0 "Progress came slowly, until a minor breakthrough emerged from an unexpected source. A junior servant, overlooked in earlier questioning, came forward after overhearing fragments of conversation the night of the theft. They recalled one of the intruders speaking in hushed urgency, warning the others that without the talisman, 'the ashes would take them as well.' Though the conspirators remain unidentified, the purpose of the stolen relic becomes clearer. The object was not symbolic. It was protection. The lead is incomplete, but enough has been recovered to establish a pattern of intent."
 ZAV_divine_saviours_events.4.a:0 "..."

 ZAV_divine_saviours_events.5.t:0 "Silence in the Estate"
 ZAV_divine_saviours_events.5.d:0 "The investigation yielded nothing of substance. Those within the estate either know nothing, or refuse to speak further. Several members of the household were found dead under unclear circumstances. No signs of stuggle and no witnesses. With all potential leads extinguished, the investigation has gone cold. The stolen talisman is gone, and whatever purpose it served remains unknown. Unease has spread among the nobility following this incident, even warranting a mention at the round table."
 ZAV_divine_saviours_events.5.a:0 "..."

 ZAV_divine_saviours_events.6.t:0 "Killings in Lowmarket"
 ZAV_divine_saviours_events.6.d:0 "A series of brutal killings has been reported in the Lowmarket district of New Camelot. Victims appear to have been selected at random, their remains arranged in deliberate formations. Witnesses report shrouded figures fleeing the scene, though none could provide clear descriptions. The scale and nature of the violence suggest ritual intent."
 ZAV_divine_saviours_events.6.a:0 "..."

 ZAV_divine_saviours_events.7.t:0 "Not a Murder, an Offering"
 ZAV_divine_saviours_events.7.d:0 "Investigators confirm that the bodies were arranged with geometric precision, their positioning forming a pattern not immediately recognizable. Blood appears to have been deliberately collected and redistributed across the scene. One surviving witness claims the perpetrators spoke in reverence, referring to the act as a 'gift.' The investigator warns that the killings may not be the goal, but a means to something greater."
 ZAV_divine_saviours_events.7.a:0 "Use an artifact to trace ritual energy."
 ZAV_divine_saviours_events.7.b:0 "Proceed along another route."

 ZAV_divine_saviours_events.8.t:0 "Echoes of Devotion"
 ZAV_divine_saviours_events.8.d:0 "The Blighted Flesh reacted violently when brought near the site, drawing out residual energies left behind by the ritual. Investigators briefly witnessed a projection: figures kneeling before an unseen presence, their bodies strengthened by something unseen. The ritual was not merely symbolic. It was a transfer of power."
 ZAV_divine_saviours_events.8.a:0 "..."

 ZAV_divine_saviours_events.9.t:0 "Patterns in the Fog"
 ZAV_divine_saviours_events.9.d:0 "Though the ritual site yields little at first glance, a scholar attached to the investigation identifies a recurring geometric structure within the arrangement of the bodies. The pattern, when reconstructed, aligns with known heretical rites associated with sacrificial empowerment. The positioning was not arbitrary, it was designed to channel something beyond the material. While the perpetrators escaped, their intent is no longer in question. The killings were conducted to draw strength, not merely to terrorize."
 ZAV_divine_saviours_events.9.a:0 "..."

 ZAV_divine_saviours_events.10.t:0 "Another Night in Lowmarket"
 ZAV_divine_saviours_events.10.d:0 "Before investigators made meaningful progress, the killings have resumed. This time, they have been more brazen, entire alleyways are left strewn with bodies, arranged in increasingly elaborate formations. Panic has spread through Lowmarket. Civilians have begun to flee, abandoning their homes and livelihoods in desperation. With no understanding of the pattern or purpose behind the violence, authorities have been forced to impose harsh containment measures. Whatever the perpetrators sought, they have taken it, and left nothing behind but fear."
 ZAV_divine_saviours_events.10.a:0 "..."

 ZAV_divine_saviours_events.11.t:0 "Guardian Priest found Dead"
 ZAV_divine_saviours_events.11.d:0 "A senior guardian priest assigned to guard the Vault of Saint Constantine has been found dead in his quarters on Llamrei street, in close proximity to the Moonlight Chapel. No signs of forced entry were found. The corpse shows evidence of prolonged distress prior to death. Given the sensitivity of his post, the matter has been escalated immediately. This murder is similar to others we've seen previously by proponents of the Shadows of the Night."
 ZAV_divine_saviours_events.11.a:0 "..."

 ZAV_divine_saviours_events.12.t:0 "He didn't die quickly"
 ZAV_divine_saviours_events.12.d:0 "The investigator reports clear signs of torture, though no instruments were found at the scene. The guard's fingernails are torn, and deep markings cover the walls, suggesting he attempted to resist or escape. Fragments of writing indicate he was forced to recall procedural details repeatedly before his death. It is still unclear whether information was extracted from him prior to his execution."
 ZAV_divine_saviours_events.12.a:0 "Continue with the investigation."

 ZAV_divine_saviours_events.13.t:0 "A Message left Behind"
 ZAV_divine_saviours_events.13.d:0 "The investigation into the death of the guardian priest has stalled, yet a final detail has been uncovered. Hidden beneath the guard's bedding, investigators found a scrap of parchment overlooked during the initial sweep. Written in a shaking hand, it contains fragmented references to the Divine Saviours and repeatedly mentions the 'king that bleeds.' The information is too incomplete to rule out the involvement of other orders, but it confirms that the Divine Saviours have a connection to this murder. We have no way of knowing whether sensitive information pertaining to the vault was divulged. There may be a breach already in motion."
 ZAV_divine_saviours_events.13.a:0 "..."

 ZAV_divine_saviours_events.14.t:0 "Disturbance at Moonlight Chapel"
 ZAV_divine_saviours_events.14.d:0 "Reports from Moonlight Chapel indicate erratic behavior among clergy and visitors alike. Several individuals have fled the site in a state of extreme agitation, while others remain inside, unresponsive. Witnesses describe a starry dust being dispersed within the chapel halls. The situation is rapidly deteriorating. We are under attack."
 ZAV_divine_saviours_events.14.a:0 "..."

 ZAV_divine_saviours_events.15.t:0 "Widespread Hysteria at the Chapel"
 ZAV_divine_saviours_events.15.d:0 "Priests have confirmed the presence of a foreign substance inflicting madness on those exposed to it. The unfortunate souls to have been afflicted by the madness have shown signs of hysteria and often turn on one another. Despite this, a small group within the chapel seems unaffected, moving with purpose through the chaos. The sacred ashes of Saint Morvydd that has recently been stolen from one of our cathedrals is likely the artifact that has been used to cripple the chapel's defenses."
 ZAV_divine_saviours_events.15.a:0 "Use our resources to track the unaffected figures."
 ZAV_divine_saviours_events.15.b:0 "Head directly to King Arthur's tomb."

 ZAV_divine_saviours_events.16.t:0 "Through Madness, a Path"
 ZAV_divine_saviours_events.16.d:0 "The Shroud revealed a coordinated movement beneath the chaos. The unaffected individuals were navigating toward a concealed passage below the chapel. They were carrying with them a protective charm, likely the source of their immunity. They appeared to be heading for the Vault of Saint Constantine. Given the weakened state of our guardian priests, a single aggressor was captured. Realising his fate, this man released his will and let the deity he had been praying to corrupt his body. Besides his lifeless corpse, the talisman was found."
 ZAV_divine_saviours_events.16.a:0 "..."

 ZAV_divine_saviours_events.17.t:0 "Blood Crown"
 ZAV_divine_saviours_events.17.d:0 "By the time our forces reached the lower chambers, to the tomb of King Arthur, bodies littered the floor of the great burial chamber. Our defenses had been broken, priests assigned to guard the vault lay on the ground, twisted and lifeless. The intruders have stolen the Blood of King Arthur, a Slaughter Relic class artifact. A single marking was left on the wall of the tomb: a crown split open, from which blood flows downward. With the enemy in control of an artifact of such power, it may not be too long before the forces moving in the shadows face us in the open."
 ZAV_divine_saviours_events.17.a:0 "May the Lady have pity on us."

