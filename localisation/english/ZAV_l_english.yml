 ZAV_artifact_1:0 "§tBlood of King Arthur§!"
 ZAV_artifact_1_effect:0 "Can resurrect a mortal from beyond the veil."
 ZAV_artifact_1_desc:0 "Drawn from the once-mortal vessel of Avalon's greatest king as he lay upon his final bed, this relic is said to carry echoes of an age when legend walked openly among men. Its crimson sheen never dulls, and those who gaze upon it feel a distant call to conquest, unity, or ruin, none can say which. The power within it is ancient and absolute, but whether it reflects Arthur's will... or something that claimed him in his final moments... remains uncertain."

 ZAV_artifact_2:0 "§6Ashes of the Green Knight§!"
 ZAV_artifact_2_effect:0 "Can protect its user from all physical harm."
 ZAV_artifact_2_desc:0 "Gathered from the grave of the enigmatic Green Knight, these ashes stir faintly even when undisturbed, as though remembering an oath never truly fulfilled. Those who wield them are said to become untouchable, shielded by an unseen force that bends fate itself. Yet this protection is not without unease, for something watches through it, something patient, as if the bargain has yet to be fully claimed."

 ZAV_artifact_3:0 "§0Corrupted Rose§!"
 ZAV_artifact_3_effect:0 "Shatters the mind of those who touch it."
 ZAV_artifact_3_desc:0 "Plucked from the grave of a condemned heretic, this blackened rose appears perpetually fresh, its petals soft despite their unnatural hue. Its true purpose remains unclear, yet those who carry it report whispers in dreams and a growing sense that the world itself is subtly... wrong. Whether it is a key, a signal, or the seed of something far worse has yet to be determined."

 ZAV_artifact_4:0 "§9Fallen Hero Sword§!"
 ZAV_artifact_4_effect:0 "Possesses its wielder, forcing them to serve an unkown entity."
 ZAV_artifact_4_desc:0 "Once borne by a champion of the realm, this fractured blade now radiates a dim, blood-red glow, its surface cracked as though it had been broken not by force, but by betrayal. From within its wounds seeps a slow, endless trickle of blood that never dries. In battle, it grants terrible strength, but with each strike, it seems to remember what it once was... and what it has become."

 ZAV_artifact_5:0 "§3Shroud of the Fey§!"
 ZAV_artifact_5_effect:0 "When burned, reveals all presences in an area."
 ZAV_artifact_5_desc:0 "Attributed to Morgan of the Fey, this tattered veil is etched with shifting inscriptions that resist interpretation. When worn, it unveils all hidden presences, spirits, illusions, and beings that lurk just beyond perception. Yet prolonged use reveals more than intended, as the veil does not distinguish between what should be seen and what was never meant to be."

 ZAV_artifact_6:0 "§0Twisted Grail§!"
 ZAV_artifact_6_effect:0 "When drank from, gives colossal power but at a tremendous price..."
 ZAV_artifact_6_desc:0 "A perversion of Avalon's most sacred symbol, this malformed grail pulses with a suffocating aura of power. Dark veins crawl across its pitted surface, as though something within struggles to emerge. Those who draw near feel their thoughts weighed down, their will diminished, as if in silent reverence to an unseen master. It is not merely an object of worship. It is a conduit."

 ZAV_artifact_7:0 "§0Blighted Flesh of a False God§!"
 ZAV_artifact_7_effect:0 "May be used as a vessel for a blighted deity. Is attracted to sinister energies."
 ZAV_artifact_7_desc:0 "Recovered from a twisted ritual, this decaying mass was once intended as a vessel for a heretical deity. Though lifeless in form, it twitches faintly, as if awaiting completion. Its presence spreads rot and unease, and those who linger too long report visions of something vast and incomplete, straining against the boundaries of reality, seeking form through a host willing or unwilling."

 ZAV_artifact_8:0 "§9True Excalibur§!"
 ZAV_artifact_8_effect:0 "Capable of killing beings from beyond the veil."
 ZAV_artifact_8_desc:0 "PLACEHOLDER"

 ZAV_artifact_9:0 "§7Putrid Crustacean§!"
 ZAV_artifact_9_effect:0 "Spreads rot and decay to everything it touches."
 ZAV_artifact_9_desc:0 "Recovered from the blackened tides beyond Avalon's shores, this malformed creature was discovered at the center of a spreading blight that twisted fish into abominations and turned clear waters into foul, choking mire. Its shell is cracked and oozing, its limbs uneven and constantly shifting, as though its form cannot settle upon a single reality. Even in containment, it emits a slow, creeping corruption, metal tarnishes, water stagnates, and living things recoil in its presence."

 ZAV_artifact_10:0 "§9Warding Talisman§!"
 ZAV_artifact_10_effect:0 "Capable of protecting the users from spreading madness."
 ZAV_artifact_10_desc:0 "PLACEHOLDER"

 ZAV_add_artifact_excalibur_tt:0 "The §9True Excalibur§! will be stored in the §YVault of Constantine§!."
 ZAV_add_artifact_putrid_crustacean_tt:0 "The §7Putrid Crustacean§! will be stored in the §YVault of Constantine§!."
 ZAV_remove_artifact_blood_of_king_arthur_tt:0 "The §tBlood of King Arthur§! has been stolen from the §YVault of Constantine§!."

