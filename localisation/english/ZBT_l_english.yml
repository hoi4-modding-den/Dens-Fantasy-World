 ZBT_established_mining_town:0 "Established Mining Town"
 ZBT_established_mining_town_desc:0 "In the foothils of the Riphean Mountains, Basaltropolis' primary industry since the 1800s has been resource extraction. Mining is so woven into the local culture that many have built houses in the sides of the caves they work in."

 ZBT_refugee_influx:0 "Refugee Influx"
 ZBT_refugee_influx_desc:0 "Basaltropolis was spared from the destruction of Malphas' rampage, but that only meant that the city would be flooded with a wave of refugees fleeing the sea of insanity the rest of Nestoria became. The Sayani Civil War to our southeast has only increased the stream of people coming into our city, and whatever systems we previously had to shelter them are quickly breaking down."

 ZBT_political_enthusiasts:0 "Political \"Enthusiasts\""
 ZBT_political_enthusiasts_desc:0 "Growing discontent against the rule of Duke Esta has inspired the populace to form social clubs, known as §LAction Societies§!, to discuss the formation of a government with decreased royal influence. The importation of radical ideas from other parts of Kuvivalwiki has only worsened the issue, with some Societies advocating for radical ideas like complete seperation from the Nestorian Empire and the abolition of the nobility. While these groups agree on very little, they have become incredibly disruptive thanks to their very public advocacy for their preferred ideology."

 ZBT_undercity:0 "The Undercity Project"


 # Decisions - Undercity
 ZBT_undercity_cat:0 "The Undercity Project"
 ZBT_undercity_cat_desc:0 "Our finest geologers, engineers, and remote seers have determined that expanding our city downwards will be much more complicated than previously thought. We will only be able to dig out a limited number of underground Sectors for each layer of §gDepth§!, and excavating deeper layers of rock will require more time and §CUpgrades§!.\n\nWe are currently at a §gDepth§! of [?UC_depth|Y0].\nThere are [?UC_empty_sectors|Y0] §6Empty Sectors§! in this layer we can fill with underground buildings.\nThere are [?UC_unexcavated_sectors|Y0] §5Unexcavated Sectors§! worth of space we can use before needing to dig deeper."

