 # Decisions - Undercity
 ZBT_undercity_cat:0 "The Undercity Project"
 ZBT_undercity_cat_desc:0 "Our finest geologers, engineers, and remote seers have determined that expanding our city downwards will be much more complicated than previously thought. We will only be able to dig out a limited number of underground Sectors for each layer of §gDepth§!, and excavating deeper layers of rock will require more time and §CUpgrades§!.\n\nWe are currently at a §gDepth§! of [?var:UC_depth|Y0].\nThere are [?var:UC_empty_sectors|Y0] §6Empty Sectors§! in this layer we can fill with underground buildings.\nThere are [?var:UC_unexcavated_sectors|Y0] §5Unexcavated Sectors§! worth of space we can use before needing to dig deeper."

