 # Characters
 ZBT_duke_esta:0 "Duke Esta"
 ZBT_duke_esta_desc:0 "WIP Despite his humble beginnings as an attendant in the household of Chrysean noble families, Corwin Esta has managed to climb his way to the upper echelons of Basaltropolitan society. Using his connections with mining companies and the surviving local nobility, he was able to seize control of the city during the chaos of the Fall of Chrysea, styling himself as a duke to legitimise his rule."



