 # Nat Spirits
 ZBT_established_mining_town:0 "Established Mining Town"
 ZBT_established_mining_town_desc:0 "In the foothils of the Riphean Mountains, Basaltropolis' primary industry since the 1800s has been resource extraction. The city has built itself around this, with houses and factories blending in seamlessly with the mountainsides and cavern walls."

 ZBT_refugee_influx:0 "Refugee Influx"
 ZBT_refugee_influx_desc:0 "The city has been flooded with a wave of refugees fleeing the destruction of The Razescape. The chaos in Caelea and the Sorcerer Realm to our east has only increased the stream of people coming into our city, and whatever systems we previously had to shelter them are quickly breaking down."

 ZBT_political_enthusiasts:0 "Political \"Enthusiasts\""
 ZBT_political_enthusiasts_desc:0 "Growing discontent against the rule of Duke Esta has inspired the populace to form social clubs, known as §2Action Societies§!, advocating for reform and to decrease the power of the Duke. The importation of radical ideologies from other parts of Kuvivalwiki has only worsened the issue, with some §tSocieties§! enthusiastically supporting extreme ideas like complete separation from the Chrysean Empire or the abolition of the nobility.\n\nWhile these groups are fragmented and agree on very little, they have become a major threat to the Duke's authority. Some reactionaries have created the §OCivic Defence Cadre§!, an organisation dedicated to opposing the Action Societies, but their loyalty to the Duke is questionable."

 ZBT_undercity:0 "The Undercity Project"
 ZBT_undercity_dm_tt:0 "The Undercity can be expanded via §YDecisions§!, adding offmap buildings and more modifiers."


