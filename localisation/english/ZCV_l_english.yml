# Leaders Loc
 ZCV_corrupt_official:0 "Corrupt Official"
 ZCV_warden:0 "The Warden"
 ZCV_deep_state:0 "The Overseers"

 ZCV_otto_bauer:0 "Otto Bauer"
 ZCV_otto_bauer_desc:0 "Approached by a mysterious organisation, Bauer was pushed to run in the last elections. While facing political opposition and major public opposition, Bauer saw a significant victory in the election, and has since lay idle allowing the nation to be overrun by criminal organisations leading to the collapse of the banks in the nation."
 ZCV_friedrich_graf:0 "Friedrich Graf"
 ZCV_friedrich_graf_desc:0 "Previously leading the nation during the Unification Wars, Graf became a popular figurehead of the nation, leading to a golden age up until his retirement in 1933. After the assassination of ex-president Otto Bauer, he has returned to rebuild the nation after the devastation caused by his late successor. A major supporter of military crackdowns and funding, he had eventually been given the nickname of "The Warden" as his age saw the courts stretched thin from large amounts of treason cases and a significant increase in the armed forces."
 ZCV_BIS_Hicom:0 "Bureau of Internal Security"
 ZCV_BIS_Hicom_desc:0 "Operating from the shadows as a pupeteer and instating the Bauer regime, the Bureau of Internal Security has intervened in domestic affairs in the nation since it's founding in 1887. However, the bureau has recently shifted towards uniting the nation under a military-run totalitarian regime in which they have power over the masses."
 ZCV_johann_beck:0 " Johann Beck"
 ZCV_johann_beck_desc:0 "Operating as the leader of the Bureau of Internal Security, Beck is also a far-right activist and writer, publishing many books on the supremacy of the Wighardian people in relation to the neighbouring species. Orchestrator of the Bauer administration, Beck helped to undermine the nation in order to achieve a new and more powerful Wighardia led by a military-controlled surveilance state where he has supreme power. Furthermore, his writings also feature multiple mentions of other species being 'a plague on this very world which must be exterminated as a top priority.' However, the extremism of his ideas has led him to be outcast in the political circle and forcing him to return to purely leading the BIS with minor political contributions."
 ZCV_sven_gramlich:0 ""
 ZCV_sven_gramlich_desc:0 ""

