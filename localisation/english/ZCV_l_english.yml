ZCV_collapsing_union:0 "Collapsing Union"


# Events Loc
 ZCV.1.t:0 "March on Ardenheim!"
 ZCV.1.d:0 "An organised group of rebels originating from high command from the WNP have stormed our capital and assassinated our president, Otto Bauer. Military general Friedrich Graf has since taken up emergency powers and attempted to reinstate order in the capial, but all attempts currently seem futile."
 ZCV.1.a:0 "How horrible!"
 ZCV.2.t:0 "Valentines Revolution"
 ZCV.2.d:0 "Large groups of citizens from Immenwald, a nation within our union, marched onto the streets before declaring independence and instating the old king, Heinrich II, onto the throne of their nation. They claim their reasons for this is the illegal occupation of their land since the Unification Wars, and the economic downfall under Bauer. We could deal with this in two ways: either let them be free and focus on our own nation, or we could attempt to take back their lands by force."
 ZCV.2.a:0 "We didn't need them anyway."
 ZCV.2.b:0 "We will not let this happen. Mobilise the military!"
