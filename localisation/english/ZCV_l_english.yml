 # Focus Loc
 ZCV_end_corruption:0 "Reshuffle the Government"
 ZCV_end_corruption_desc:0 "The government during the last era of our nation has lead to widespread corruption among our politicians. Only a complete reshuffle and reform of the government will be able to fix the amount which is currently entrenched in our politics."
 ZCV_rebuild_banks:0 "Restore the Banks"
 ZCV_rebuild_banks_desc:0 "After the economic instability and crashes of our previous era, our banking system was one of many victims of repeated attacks by the criminal organisations of our nation. With some funding, we can lift the banks out of the monetary hole they have been placed in to attempt to restore our nation's economy."
 ZCV_reinstate_order:0 "Reinstate Order"
 ZCV_reinstate_order_desc:0 "After the March on Ardenheim, we have been forced to move our capital eastward. However, we can use our men to take back our capital city and reinstate order once and for all."
 ZCV_reunite_nation:0 "Reunite the Nation"
 ZCV_reunite_nation_desc:0 "Now that the chaos in our nation has settled, we can circumvent any remaining attempts of separatist rebellions and integrate our population under our capital. This also allows us for further political expansions to improve our nation, military, and economy to rival and overcome our neighbours."
 ZCV_from_the_shadows:0 "From the Shadows"
 ZCV_from_the_shadows_desc:0 "Ever since the beginning of Bauer's term, the Bureau of Internal Security's interference in domestic affairs has significantly increased. We can use this to instate them as the leader of our nation and allow them to take full control over foreign and domestic affairs. This will allow us to remilitarise"

 ### C O M M U N I S T ###
 ZCV_teachings_marx:0 "Uplift the Teachings of Marx"
 ZCV_teachings_marx_desc:0 "Now that our nation is finally stable, we can put an end to the utopia the upper classes live in expense of our citizens and working class. Specifically, men like those who were in charge and lay idle during the Bauer Era must be purged in order to achieve a common utopia for all citizens."
 

 # Ideas Loc
 ZCV_banking_crisis:0 "Catastrophic Banking Crisis"
 ZCV_banking_crisis_desc:0 "Due to the two years of sharp economic decline, our banks have begun to close down and if we do not interfere quickly it may be too late."
 ZCV_relieved_banks:0 "Relieved Banks"
 ZCV_criminal_underworld:0 "Significant Criminal Underworld"
 ZCV_criminal_underworld_desc:0 "Due to the idleness of Bauer's term, major criminal organisations have begun to undermine the foundations of the nation by selling, producing, and distributing illegal supplies to our citizens, straining our economy and stability as we attempt to deal with these gangs."
 ZCV_criminal_underworld_1:0 "Major Criminal Underworld"
 ZCV_criminal_underworld_2:0 "Minor Criminal Underworld"
 ZCV_corruption_ended:0 "Total Government Reform"
 ZCV_corruption_ended_desc:0 "Due to the extent of Bauer's corruption, the government requires a total reform in order to expel it of corrupt politicians. However, this significantly decreases our political capabilities while we are reforming the government so that we can continue on a path towards recovery for our nation."
 ZCV_marxism:0 "Wighardian Marxism"
 ZCV_marxism_desc:0 "With the tragic loss of life and significantly decreased quality of life due to the Bauer Era, we have realised that the true enemy is not from other nations, but is found domestically in our upper classes. We can expunge our nation of the plague which is capitalism and those who benefit from it and allow our nation to achieve a §YSecond Golden Age.§!"
 ZCV_martial_law:0 "Eye of Providence"
 ZCV_martial_law_desc:0 "Our deep state plan has finally succeeded, and now we can transform the nation into a surveilance state and crush any dissidents by force using our vast military policing programmes."

