 ZCV.5.d:0 "Since its formation in 1887, the Bureau of Internal Security has kept order in our nation, especially while Bauer caused rampant instability and chaos during his term. However, his term also increased the nation's reliance on the bureau as increased funding and recruitment was achieved during his term, boosting the bureau into the most influential entity in our nation's government. However, reports from the BIS' "
 ZCV.5.a:0 "We didn't need them anyway."

