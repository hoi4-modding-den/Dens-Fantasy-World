#ideas
ZFA_arenigwade_liberation_army: "Ārenigwadē Liberation Army"
ZFA_arenigwade_liberation_army_desc: "Ārenigwadē Liberation Army was created to spread our ideals across Balekelemi region together with start of revolution. Unfortunately, every person who looks deeper into it knows that it needs reforms to be force capable of defending communist ideals. For now though many in the elites think that this should happen after war, while most officers say that we cannot wait longer."
ZFA_factionalism_within_front: "Factionalism Within Front"
ZFA_factionalism_within_front_desc: "ĀHG is not an monolith - various people went into it. Basically only thing that unites us is our Ārenigwadi background and anti-government views, but that is where similarities mostly end. While most opponents to our revolution had been removed, problems rise inside. Problems, which left without any solution can burst into another civil war even."

#focuses
ZFA_nationwide_revolution: "Nationwide Revolution"
ZFA_nationwide_revolution_desc: "Our state had treated it`s people as badly as never. They suffer day to day, commonly dying. Meanwhile Unetu`s clique continues to reap fruits of what is de facto slavery. Balekelemi people already suffered enough under rule of opressive Bīchi regime. They won`t ever trust regime again. They will only trust us. Us, because we will bring change to them."
ZFA_nationwide_revolution_tt: "The §RRevolution§! shall bring the long-awaited respect for common people..."

