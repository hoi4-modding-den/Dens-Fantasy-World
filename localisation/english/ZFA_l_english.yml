#events
ZFA_news_events.1.t: "Ārenigwade Revolutionaries win Balekelemi Civil War"
ZFA_news_events.1.desc: "For centuries, Balekelemi region was held mostly by despotic fist, most lately under Bīchi one. Now it seems that times of authoritarianism are gone for good, although few would expect that the ideology that would replace old system will be the communist one. \n \nThe Ārenigwadi led revolution, which started in the east, managed to crush any opposition and set up a new people`s republic. Many are expecting the government to not be capable of holding whole region for long, although events are too unpredictable for now to give any conclusions."
ZFA_news_events.1.a: "New, better times for people finally approach."
ZFA_news_events.1.b: "Communism in Balekelemi?"

