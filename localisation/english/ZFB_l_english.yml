#events
ZFB_news_events.1.t: "Bīchi Government wins Balekelemi Civil War"
ZFB_news_events.1.desc: "Bīchi elite had ruled Balekelemi region for 5 decades now. It`s unpopular policies which alienated most of people, as well as overall regression of state status around the world were factors which had caused revolts to show up from all sides. Still, what was not that obvious, government located in Kekelem Dinite managed to squash all uprisings. \n \nTalakji Unetu, leader of "Greatest United Republic", had announced that nothing will stop his plans in modernising the state and maintaining Bīchi rule over Balekelemi. Whether he will do what he promised is up to debate, although, for now at least, silence finally shows up in the region."
ZFB_news_events.1.a: "Order restored, traitors destroyed."
ZFB_news_events.1.b: "Peace at last... although for how long?"

