#ideas
ZFK_reconstituted_kingdom: "Reconstituted Kingdom"
ZFK_reconstituted_kingdom_desc: "For more than 400 years, our Kingdom had dimminished. What was afterwards is obvious: chaos, civil wars and downfall of nation. It is pretty obvious that our rule was best what ever happened to the region, if not the world. People beg us to bring Balekelemi back into it`s greatness, to it`s second golden age. We will do that. Of course our kingdom is quite new and needs to be reorganised to meet new standards. Fortunately, we have eager people that will always work for our jewel. We will bring kingdom together to unite Balekelemi, this time permanently."
ZFK_underdeveloped_mess: "Underdeveloped Mess"
ZFK_underdeveloped_mess_desc: "Western parts of Balekelemi are least developed. Considering Balekelemi is overall not considered as developed compared to Gardenia for example, that indicates really bad about that territory."


#focuses
ZFK_return_to_greatness: "Return to greatness"
ZFK_return_to_greatness_desc: "Our kingdom had been lost for 400 years. It was beginning of dark years for Balekelemi region overall, with series of usurpations and foreign invasions. No one ever believed that we would show up again, but we did, after gathering enough resources. It was not easy, but we managed to create administration and army. That war, while bad, is necessary to destroy all foes. It will be start of our resurgence, our greatness... We won`t fail!"
ZFK_return_to_greatness_tt: "Everyone thought we were dead... yet we live... §Yand we will avenge past centuries of humiliation!§! "
