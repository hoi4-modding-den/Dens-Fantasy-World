#events
ZFK_news_events.1.t: "Keyi Monarchists win Balekelemi Civil War"
ZFK_news_events.1.desc: "Everyone thought that after fall of Keyi Kingdom, once an formidable force capable of crushing every neigboring state, would not ever return after it`s demise in 16th century. Keyi elites were mostly murdered, west underfunded, and many forgot about their existence. However, that is not anymore the case, as word "Keyi" appeared everywhere again after not only it had risen from the ashes, but also crushed any competition for control over Balekelemi. \n \nThe recreated entity stands with new difficulties showing ahead. Although regime seems to be somewhat popular even among non-keyi citizens, the question remains whether king is an actual independent ruler, as well as the unfriendly international environment where it looks like monarchies fall one after another."
ZFK_news_events.1.a: "This time we will not dissapear, our golden age will last forever."
ZFK_news_events.1.b: "Impressive how they managed to return after so long."

