#events
ZFS_news_events.1.t: "Sayani Democrats win Balekelemi Civil War"
ZFS_news_events.1.desc: "Ideals of democracy were starting to show up in 19th and especially in early 20th century, when more and more people started dreaming of something they never tried. That moment seems to finally show up, although not many would expect that it would be Sayani of all groups which would introduce it to all of Balekelemi. \n \nNew government already announced creation of republic for all people`s, but many doubt the honesty of these words, especially considering excludment of Semayawi group from governance. Still, many experts say that if everything will stay stable, this democratic experiment may succeed."
ZFS_news_events.1.a: "Not only democracy wins - Sayani also wins!"
ZFS_news_events.1.b: "Sayawho?"

