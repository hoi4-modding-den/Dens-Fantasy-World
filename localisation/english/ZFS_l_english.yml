#ideas
ZFS_growing_discontent_within: "Growing discontent within"
ZFS_growing_discontent_within_desc: "Our leader, Sosite Gebere, is an populist leader. In the Balekelemi soil this is completely new thing. However, question remains whether his plans are sustainable or possible to introduce. Inside the alliance there are some democrats who do not like direction which Gebere wants to take, promoting idea of less populism. There is also armed wing of our organisation led by Sannayne Mokwete Iliihi, who is clearly an autocratic figure who promotes idea of military with a state, an obvious contrast to our democratic principles. Still, everyone needs everyone inside our Sayani alliance, as removal of one could result in dire consequences."
ZFS_rule_of_the_minority: "Rule of minority"
ZFS_rule_of_the_minority_desc: "Every Balekelemi state used to be ruled by minority, but our example is even more extreme. In our Sayani territories there is sizeable Semayawi population which overall surpasses Sayani one. It is obvious that if we included them in our democracy, we would lose power, so we have to exclude them. While they are weak, we can use them to fulfill our ideals, especially as Semayawi see us as the least of the evils. Still we need to be careful about them and keep them in check."

#focuses
ZFS_our_greatest_chance: "Our greatest chance"
ZFS_our_greatest_chance_desc: "Sayani people were never in power. Not only that, they were always a toy for stronger forces like Keyi or Semayawi ones. But that is past now. We managed to overpower our long time opressors through skill and unity of our people. Western "kingdom" is a laughable force that will pose no threat to us. Whether someone thinks force is good or bad, we, Sayani people, must agree that our nation deserves recognition and redemption. Time to abandon old opressors, it is time for Sayani led democratic republic where we have recognition we always strived for. It is only way and only time for it."
ZFS_our_greatest_chance_tt: "Times when Sayani people were discriminated are over... It is time for §Your led Sayani change!§!"
