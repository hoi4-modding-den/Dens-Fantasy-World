ZF_balekelemi_civil_war_desc: "The Balekelemi Civil War is ongoing from 1934 and has already taken lives of thousands of civilians and soldiers. Economy is weakening, isolation is increasing, and no faction wants to make an agreement. No one yet knows how long war will take. There is one thing that is clear to everyone: survivor will have hard time merging the already extremely divided nation."