ZF_balekelemi_civil_war_desc: "From several decades now, Balekelemi region has been in decline. When Bīchi elite got into power, that only accelerated - corporations got much influence and other groups were marginalised. Frontiers and Pīchi became pretty much independent from central authority. Economy went into state never seen before as local buisnesses were marginalised... \n\nThat is not only reason that civil war happened however. Not everyone agreed with the firm authoritarian hand of Bīchi regime, in addition backed by oligarchs. Some turned into communism, some into democracy, some into monarchism, and many others want other systems. Time will show which idea will come on top... idea which will be paid with §Rblood§..."
