 # LEADERS
  ZIA_osvald_cereduj_name:0 "Òsvald 'iónne' Çeredůj Sardelá"
  ZIA_osvald_cereduj_desc:0 "Born May 2nd 1931 to a wealthy family across the sea to a foreign father and a royal mother. Òsvald Çeredůj Sardelá (Born with the name of 'Osziü Eltergom'). The mother in question being the queen of Çialazar, and the father being a secret lover from Potanica. For a few years their relationship and child was a secret. But soon enough the secret came out. Returning home to Çialazar the rumour of the princes foreign birth circulated across the palace halls. When the queen tried to quiet these rumours, it was futile. However, instead of Òsvald getting the blame their mother was shunned and constantly shamed day in and out for her mistakes overseas. Eventually, she snapped and commited suicide. Òsvald became very isolated after his mothers death, and he wasnt't supposed to succeed king originally. But when his brother Àlteç died from a fishing accident the only valid successor was him. In 1930 his father caught seascurvy, bedridden he legitimized Òsvald as the successor of the kingdom. Despite the controversies of this decision Òsvald was subsequently crowned in a traditional sermon a week after his fathers death. The aftermath of his and his nations trauma has not yet faded, protests riot and schemes to install other claimants go on in the background. It's all up to him to fix the aftermath of the succession crisis now. "
