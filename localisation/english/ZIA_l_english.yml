 # IDEAS
  legacy_of_the_maritimes:0 "Legacy of the Maritimes"
  legacy_of_the_maritimes_desc:0 "Once upon a time Çialazar was a thriving maritime empire stretching across the great seas, naval innovation used to be central to our nation. But after the years of being stomped under the boots of others we've declines. Our navy is weak, we lack funding for expansions."
  metropolitan_general_strike:0 "Metropolitan General Strike"
  metropolitan_general_strike_desc:0 "The labour rights movement in Çialazar has had a fragile history of protests and massacres, after the past king came to power he consolidated and suppressed the movements. Instead of dissapearing though, the core of the movement only grew and soon underground networks formed to protect the integrity of the organizations. The pot is filling up, day after day, incident after incident, speech after speech. The workers are becoming impatient.... If something is not done to put an end to the protests for good an insurrection is inevitable"
  the_mountain_nest:0 "The Mountain Nest"
  the_mountain_nest_desc:0 "After the decline of our maritime empire the monarchy of Çialazar allied itself with it's neighbors and embraced the Pan-Mjódnů sentiment which engulfed the 3 kingdoms. This paved the way for a united state for the Mjódnů peoples which carried on for 3 decades, but after several incidents and due to internal pressures and ethnic strife it eventually burned down in flames. Resulting in a 8 year war between Tůrůń and Hráva, ending in a ceasefire. Emerging from this yoke we managed to gain our independence, but we aren't safe despite that. Growing tensions between our borders and future fears makes it clear to us that we need to rearm and defend to the last man."