 # EVENTS
 ZIE_lore.1.t: "The Legacy of the Second Urhú War"
 ZIE_lore.1.d: "On the 3th of May 1906 shortly after the mountainflowers bloomed the Second Urhú War broke out, following skrimishes at the Urhú mountains the Hrávan army used the damage to infrastructure as a casus belli to invade through the mountains for 'peacekeeping'. After this violation of sovereignity the Tůrůń armed forces mobilized and quickly pushed the army back. They eventually reached the region of Cis-urhú, this forced the Hrávan king to send newly conscripted troops and generals to the front. One of which would be Tréphan, our marshall. Following the Hrávan response the newly mobilized recruits under the command of the new generals made their way across the plains to capture key railways and supply points. The Hrávan army recaptured the majority of their lands with the exception of Vrýtze (Renamed Víeva by Tůrůń), however they were unable to make further advances due to heavy fortifications in mountain terrain along with guerilla fighters. Follwing the stalemate battles continued for 1 year until the two sides agreed to a ceasefire, which is still in function to this day. The agreement was seen as a betrayal to the high command in Hráva, which paved the way for the eventual coup in '08. Even after the marshall seized power the scars of this war has truly never been healed, the graves remain bundled with flowers and the families continue to greive. The militarization of society has brought a new beleif in society however."
 ZRB_lore.1.a: "God rest their souls."
 ZIE_event.1.t: "Avenging our national humiliation"
 ZIE_event.1.d: "After decades of humiliation of the Hrávan nation by the western scum, our grand peoples have turned out victorious in the final war for liberation. Across our nation parades are starting, flags waving. 'We have won!' or people rejoice with joy, today the grand Marshall announced the parade for the day celebrating the victory. For hours people were waiting on the sidelines in the main square of the capital eagerly, until finally the marching band came out. Music started playing: trombones, symbals, trumpets, drums... All in a perfect harmony to the sky, the wind and the bustling city square. The parade lasted for 3 hours, with the audience clapping along. At the end a ceremony took place for war heroes and generals, granting medals. Every one of them coming up with a speech, congratulations following. As the last farewell of the ceremony the marshall of Hráva announced that he was going to give a speech later in the year to commemorate the fallen and the victorious."
 ZIE_event.1.a: "All is good in the world!"
 ZIE_news.2.t: "Hrávan victory in the third Urhú war"
 ZIE_news.2.desc: "After decades of scuffle the Urhú solution has finally come to a close, the region in which books shall be written of from now one will write about the names of the Hrávan people once again. The peacedeal signed in Tíjven has renounced Hrávan claims over the Urhú region, subsequently unrest has begun to reactivate in the western autonomous regions of Tůrůń.  "
 ZIE_news.2.a: "Hopefully the refugees stop for now."
 ZIE_event.3.t: "Knight takes Rook"
 ZIE_event.3.d: "Sergeant Tryvecna walked out of his house, he was greeted with his dear wife who was tending to the glistening rock-ridden gardens of tulips and flowers around the somewhat large and expensive house. Ever since he got his position at the national military command his income had increased significantly because of the states earnings, the Marshall had made underground deals with all of the staff to get a portion of the taxes flowing from poorer areas of the nation. Examining his house he pondered if his house was a bit too glammorous, perhaps radical citizens would take one look at it and recognize the extravagances to be tied to the government. Maybe it would be vandalized when he came home from work tomorrow? Before he could ponder any longer his wife broke his thoughts by shouting: 'Tryvecna, youre up awfully late! You better hurry and get out to the office so you don't get told off like a few months ago!' Realizing he'd just been standing there for 5 minutes, Tryvecna made his way out to the streets to take a stroll away to the headquarters. Usually he'd be taking a car with services to protect him, but his mood was up after the recent pay raise from the Marshall. He might aswell take a stroll around the city to admire the national committees accomplishments, before he could walk more than 5 blocks out he was grabbed and dragged in to an alleyway. Before he could protest loudly his mouth was covered with a wet bandage, he passed out. Waking up tied in a dark room he was confused, muffling under his taped mouth and moving his tied up hands. His futile attempts to alert somebody was stopped by a loud bang in the opposite room. A person walked in, a member of the grand council. They were holding a luger in their left hand. Without trigger discipline the man pointed the gun at his head and exclaimed:'Any info about Tréphans war and escape plans?' Tryvecna managed to muffle out: 'WHY ARE YOU DOING THIS??'\n\n§RA shot rang out.§!"
 ZIE_event.3.a: "The national revolution will be upheld one way or another."
 # NEWS EVENTS
 ZIE_news.1.t: "Outbreak of the Third Urhú War"
 ZIE_news.1.desc: "Tensions were always high before the breaking point, but at this moment skirmishes has turned into straight-out battles as Hraván forces advance through the Urhú mountains at rapid paces. This has triggered a migration crisis as desperate citizens flee to bordering countries in an attempt to escape death. As the situation evolves neighbors bide their time as chaos unfolds."
 ZIE_news.1.a: "Kill or be killed."
 ZIE_news.1.b: "LONG LIVE THE MARSHALL!"
 # LEADERS
 the_marshall: "  §RThe Grand Marshall of Hrava§!"
 trephan_bojodavic_name: "Tréphan Bojodávić"
 trephan_bojodavic_desc: "Born 1886 to a relatively poor family in the Urhú mountains, Tréphan Bojodávić grew up in a harsh environment. His father was an abusive alcoholic and his mother spent most of her time cleaning up after the deadbeat man, Tréphan basically had no social life growing up. In 1893 aged 7 years old their village became notified of border skrimishes several acres north of them. Shortly after the skirmishes turned into battles which turned into all out war, the start of the First Urhú war forced Tréphans family to flee northwards, following the Kníestra river upwards and then continuing forth over the windswept hills to Trzę. Where he would be spending the majority of his upbringing. In 1904 Tréphan enlisted into the National Army, he quickly became known among the ranks as an outspoken Nationalist. Shortly after his enlistment the Second Urhú war broke out, this time instead of fleeing Tréphan was prepared to join the ranks as a commander. Quickly Tréphan amassed an almost cult-like following around his idealistic Nationalism, he went on to win the majority of his battles as commander. But eventually he got stripped of his ranks because of the upper echelons fearing a nationalist uprising. The Urhú war ended in a loss for Hráva, unrest turned into rebellion. Before the high class could organize Tréphan and his followers began hijacking newspapers and eventually they marched on the capital. The commanders of the National guard switched sides and he took power, Tréphan formed a council of advisors to help govern the vast territories. Looking outwards, his National outlook craves expansion."
