 # IDEAS #
 an_army_with_a_state: "An Army with a State"
 an_army_with_a_state_desc: "Following the coup of '08 as a result of the Hrávan loss in the First Urhú War, the country took on a mass militarization as commanded by the Marshall. This had a side effect of sidelining the agricultural and industrial sectors of the country, the bureaucracy cannot keep up with managing both sectors at once. For now at least, our economy has grinded to a halt."
 the_national_rejuvination: "The National Rejuvination"
 the_national_rejuvination_desc: "The coup of '08 started a new century in Hráva bound by idealistic Nationalism and ethnic supremacy, the Marshall has named the phenomenon the 'national rejuvination'. Attributing it to himself, the cult like following of him as a strong man goes at the cost of the countries stability."
 indefinate_state_of_emergency: "Indefinite State of Emergency"
 indefinate_state_of_emergency_desc: "Ever since the coup of '08 a state of national emergency has been declared by the marshall as a form of controlling the populace under the pretence of national security."
 failed_land_reform: "Failed Land Reform"
 failed_land_reform_desc: "The land reform promised by the Marshall has not been fulfilled, the government has yet to comment on the suspension of the land reform. But it has undoubtedly caused massive ripples across the agricultural industry and society of our country, and certaintly not in a positive way."
