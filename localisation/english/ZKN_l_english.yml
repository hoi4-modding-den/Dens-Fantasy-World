# IDEOLOGIES

 technocracy: "Technocracy"
 technocracy_desc: "Technocracy is a system of governance in which decision-makers are selected on the basis of their expertise, particularly with regard to scientific or technical knowledge. A technocratic government tries to use the scientific method to solve social problems and uses logical calculus to find the most rational solution to any given problem based on the information available."
 nationalist_stratocracy: "Nationalist Stratocracy"
 nationalist_stratocracy_desc: "A Salvation Government or Salvation Stratocracy is a military junta that adheres to tenets of (ultra-)nationalism and seeks to unite the (ultra-)nation under a military dictatorship in an attempt to 'save' it."
 vampire_rule: "Vampiric Despotism"
 vampire_rule_desc: "Under Vampiric Despotism, the people of the nation are seen as mere livestock to sate the hunger of their vampiric overlords. Usually, the fact that the ruler is a vampire is kept secret to avoid revolt."


