 ZKN_sale_of_the_armada: "Sale of the Royal Armada"
 ZKN_sale_of_the_armada_desc: "A large portion of the Royal Gardenian Armada was sold to Hortensia to obtain funds to help the kingdom fight the Republicans. While the navy wasn't too happy about the sale, it has certainly helped our struggling economy from taking any more damage during the civil war."
