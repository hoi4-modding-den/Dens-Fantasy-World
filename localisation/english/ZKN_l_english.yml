 ZKN_the_winner_king: "Vanquisher of Revolution"
 ZKN_stratocratic_nationalist: "Stratocratic Nationalist"

 ZKN_white_silver: "White Silver"
 ZKN_white_silver_desc: "§LHailed as a hero for their actions during the last Northeastern War, this character received the White Silver medal by the Zinnian Throne.§!"
 ZKN_zinnian_loyalist: "Zinnian Loyalist"
 ZKN_zinnian_loyalist_desc: "§LThis character is loyal to the Zinnian monarchy and will only serve a royal government.§!"


# IDEAS

 ZKN_disloyal_army: "Disloyal Royal Army"
 ZKN_disloyal_army_desc: "While the Army has been voicing complaints about the monarchy for a while, with the failure to prevent the Edelweiß Revolution, the army has begun to openly challenge royal authority. Thankfully, most of the general staff hates the republicans even more than us."
 ZKN_general_strike: "General Strike"
 ZKN_general_strike_desc: "The Republicans have called for a general strike against the Zinnian Government and ground our industry to a halt."
 ZKN_throne_under_threat: "The Throne under Threat"
 ZKN_sale_of_the_armada: "Sale of the Royal Armada"
 ZKN_sale_of_the_armada_desc: "A large portion of the Royal Gardenian Armada was sold to Hortensia to obtain funds to help the kingdom fight the Republicans. While the navy wasn't too happy about the sale, it has certainly helped our struggling economy from taking any more damage during the civil war."


# DECISIONS

 ZKN_civil_war_cat: "The Edelweiss Rebellion"
 ZKN_finish_the_civil_war: "Victory of the Reaction"
 ZKN_finish_the_civil_war_quickly: "Faltering Morale..."
 ZKN_hold_the_line: "Hold Zinnien!"
 ZKN_aid_from_neighbouring_monarchies: "Aid from the East"
 ZKN_aid_from_neighbouring_monarchies_desc: "Our diplomats are attempting to negotiate with the [ZFO.GetAdjective] and [ZFD.GetAdjective] governments for support. We must maintain control over the border city of Löbnitz so we can receive it."


