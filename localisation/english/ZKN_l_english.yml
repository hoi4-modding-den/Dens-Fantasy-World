l_english:

 ZKN_GATHERING_STORM_DESC: "The Kingdom of Gardenia has devolved into civil war with the outbreak of the Edelweiss Revolution.\n \nThe Royalists have rallied under the banner of the Zinnian Throne, defending the old order of aristocratic rule. King Michael Aurus the Third only recently succeeded his father for the throne and his rule had already been plagued by internal strife among the nobility. After it became clear that civil war was inevitable, Michael authorised the sale of a significant portion of the Royal Armada to secure funds to crush the revolutionaries."

