 ZKN_call_up_levies_desc: ""
 ZKN_call_up_levies_tt: "Deploy §gFour§! §YImperial Army Brigade§! Divisions in an §Yurban state§! controlled by us."
 ZKN_empower_the_kammermeister: "Empower the Kammermeister"
 ZKN_empower_the_kammermeister_desc: "The Kammermeister (lit. 'Chamber Master') is the one person responsible for the royal treasury. This role is currently filled by Joachim Sprenkler, one of the King's most trusted aides. His position could allow us to increase our war effort spending without drawing the nobles' attention to it."
