 ZKN_the_reactionary_front_tt: "The urban areas of §Y[812.GetName]§!, §Y[832.GetName]§!, §Y[634.GetName]§! and §Y[817.GetName]§! have §Rjoined the Liberation Front§!. The Headquarters of the §YReactionary Forces§! will be moved to §Y[570.GetName]§!."
