# IDEAS

 ZKN_disloyal_army: "Disloyal Royal Army"
 ZKN_disloyal_army_desc: "While the Army has been voicing complaints about the monarchy for a while, with the failure to prevent the Edelweiß Revolution, the army has begun to openly challenge royal authority. Thankfully, most of the general staff hates the republicans even more than us."
 ZKN_general_strike: "General Strike"
 ZKN_general_strike_desc: "The Republicans have called for a general strike against the Zinnian Government and ground our industry to a halt."
 ZKN_throne_under_threat: "The Throne under Threat"
 ZKN_the_zinnia_secured: "The Zinnia Secured"
 ZKN_sale_of_the_armada: "Sale of the Royal Armada"
 ZKN_sale_of_the_armada_desc: "A large portion of the Royal Gardenian Armada was sold to Hortensia to obtain funds to help the kingdom fight the Republicans. While the navy wasn't too happy about the sale, it has certainly helped our struggling economy from taking any more damage during the civil war."
