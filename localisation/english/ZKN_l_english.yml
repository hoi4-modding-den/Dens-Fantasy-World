 ZKN_events.1.desc: "WIP"
 ZKN_events.1.a: "Cooperation will be fruitful."
 ZKN_events.1.b: "It is not in our interest."

 ZKN_events.2.t: "Avalon signs Cooperation Agreement"
 ZKN_events.2.desc: "WIP"
 ZKN_events.2.a: "Wunderbar."

 ZKN_events.3.t: "Avalon refuses to sign Cooperation Agreement"
 ZKN_events.3.desc: "WIP"
 ZKN_events.3.a: "This proves they are a threat!"
 ZKN_received_response_from_ZAV: "received a response from Avalon"

