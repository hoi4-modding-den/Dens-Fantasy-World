# IDEOLOGIES

 nationalist_stratocracy: "Nationalist Stratocracy"
 nationalist_stratocracy_desc: "A Salvation Government or Salvation Stratocracy is a military junta that adheres to tenets of (ultra-)nationalism and seeks to unite the (ultra-)nation under a military dictatorship."
 vampire_rule: "Vampiric Despotism"
 vampire_rule_desc: "In Vampiric despotism, the people of the nation are seen as mere livestock to sate the hunger of their vampiric overlord. Usually, the fact that the ruler is a vampire is kept secret to avoid revolt."


