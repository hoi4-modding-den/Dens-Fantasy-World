# EVENTS

 ZKN_cw_events.1.t: "Weapon Shipments arrive in Löbnitz"
 ZKN_cw_events.1.desc: "Thanks to the work of our diplomats, the [XFO.GetAdjective] and [XFD.GetAdjective] governments have accepted to send us military equipment to assist in our civil war."
 ZKN_cw_events.1.a: "We thank our royal allies in the east."

 ZKN_cw_events.2.t: "Loyalist Victory"
 ZKN_cw_events.2.desc: "The Republicans have been defeated. The troops of the Royal Army have brought victory to the Zinnian Throne."
 ZKN_cw_events.2.a: "The Kingdom is safe. For now."

 ZKN_cw_events.3.t: "Edelweiss Exile Government"
 ZKN_cw_events.3.desc: "With the defeat of the Edelweiss Liberation Front, various Republicans have decided to go into exile in Hortensia to escape punishment by the royalists. Some of them have offered their services to our nation."
 ZKN_cw_events.3.a: "Wilkommen, wilkommen!"

 ZKN_cw_events.4.t: "Zinnia invokes the Royalist Pact"
 ZKN_cw_events.4.desc: "WIP"
 ZKN_cw_events.4.a: "We must destroy the Republican threat."
 ZKN_cw_events.4.b: "We cannot risk it."

 ZKN_cw_events.5.t: "[FROM.GetNameDefCap] answers our Call!"
 ZKN_cw_events.5.desc: "WIP"
 ZKN_cw_events.5.a: "We'll root out the Republicans together!"

 ZKN_cw_events.6.t: "[FROM.GetNameDefCap] abandons the Royalist Pact"
 ZKN_cw_events.6.desc: "WIP"
 ZKN_cw_events.6.a: "Traitors!"


 ZKN_post_cw_events.1.t: "Restoration of the Zinnian Throne"
 ZKN_post_cw_events.1.desc: "WIP\n \nExpectedly, our allies have taken no time at all to turn on us. Immediately after relocation to Gartenstadt, the Court began to question our military spending while the army began to quietly stash away weapons."
 ZKN_post_cw_events.1.a: "I thought we were done with rebellion?"
 ZKN_post_cw_events.1.tt: "When the focus completes, we will gain a §Ynational spirit§! for Reconstruction. The time it will take depends on our £GFX_occupation_costs §YAristocratic Loyalty§!.\n \n§RThis only applies to the Zinnian Monarchy!§!"

 ZKN_post_cw_events.2.t: "Anti-Republican Campaigns"
 ZKN_post_cw_events.2.desc: "The aristocrats wish to avoid another revolution and therefore demand we implement a series of serious repressions against known republicans and possible allies."
 ZKN_post_cw_events.2.a: "We must prevent another insurgency."
 ZKN_post_cw_events.2.b: "Doing this will only alienate the people more."

 ZKN_post_cw_events.3.t: "Von Tretschau's Troops enter Gartenstadt"
 ZKN_post_cw_events.3.desc: "In the cover of the night, Soldiers of von Tretschau's Fifth Division entered Gartenstadt under the pretense of 'divisional reorganisation'. It is clear that is is a ploy, but we have no power to question or investigate."
 ZKN_post_cw_events.3.a: "What is he plotting?"

 ZKN_post_cw_events.4.t: "Salvationist Coup"
 ZKN_post_cw_events.4.desc: "The royal palace in Central Gartenstadt is quickly stormed by the soldiers. Von Tretschau and his conspirators enter the hallway to the throne room with the knowledge that King Michael is currently in a court session with some aristocrats. As they turn around the corner, the Royal Guard blocks their way, as anticipated.\n \n'Stand down, your corrupt king has lived long enough', von Tretschau calls out to the guards. They raise their arms, one of them hesitates."
 ZKN_post_cw_events.4.a: "The Royal Guard stands down."
 ZKN_post_cw_events.4.b: "The Putschists are arrested!"

 ZKN_post_cw_events.5.t: "Withered Zinnia"
 ZKN_post_cw_events.5.desc: "WIP"
 ZKN_post_cw_events.5.a: "Sweet Dreams, you Fool."

 ZKN_post_cw_events.6.t: "Camarilla establishes Regency"
 ZKN_post_cw_events.6.desc: "WIP"
 ZKN_post_cw_events.6.a: "Crush those fools!"
 ZKN_post_cw_events.6.b: "Approach them with an offer they can't refuse."

 ZKN_post_cw_events.7.t: "End of the Camarilla Rebellion"
 ZKN_post_cw_events.7.desc: "WIP"
 ZKN_post_cw_events.7.a: "Foolish fools."

 ZKN_post_cw_events.8.t: "Komtesse Yvonne"
 ZKN_post_cw_events.8.desc: "In an attempt to peacefully subdue the aristocrats, the Salvationist Clique has decided to meet with the Camarilla. Once arrived however, they noticed that the Camarilla had not bothered to show up, leading to them only meeting the Komtesse Yvonne von Karmesin, a lower noble from Rosenrade. In a surprise twist however, the Komtesse revealed to the Putschists the ultimate secret."
 ZKN_post_cw_events.8.a: "What is man but animal in all but shape and name?"

 ZKN_post_cw_events.9.t: "Restoration of Balance"
 ZKN_post_cw_events.9.desc: "Following the elimination of the Putschist Generals, the Komtesse von Karmesin and the Camarilla have seized control over Gardenia, proclaiming the Crimson Regency. The disappearance of the Junta may have been slightly suspicious, but von Karmesin isn't worried. As long as she allows them to cling to their power, the nobles won't ask any questions."
 ZKN_post_cw_events.9.a: "Judgement hath been delivered."

 ZKN_post_cw_events.10.t: "The Damned"
 ZKN_post_cw_events.10.desc: "The foolish traitors von Tretschau and Schmerz have been arrested and are scheduled to be executed. The camarilla has also uncovered the Putschists' connection to Admiral von Seestern, who supported them from the sidelines. But rest assured..."
 ZKN_post_cw_events.10.a: "...treason will not be tolerated."

 ZKN_post_cw_events.11.t: "Aristocrats demand the Kammermeister's Resignation"
 ZKN_post_cw_events.11.desc: "WIP"
 ZKN_post_cw_events.11.a: "We must placate the nobles."
 ZKN_post_cw_events.11.b: "He is more loyal than those dogs!"
 ZKN_kammermeister_resigned: "Stegehoff was forced to resign"

 ZKN_post_cw_events.12.t: "The New Camarilla"
 ZKN_post_cw_events.12.desc: "WIP"
 ZKN_post_cw_events.12.a: "What a peculiar lady."
 ZKN_new_camarilla_unlocked: "Unlocked via the §Y'$ZKN_post_cw_events.12.t$'§! event."

 ZKN_post_cw_events.13.t: "Fate of the Elbs"
 ZKN_post_cw_events.13.desc: "WIP"
 ZKN_post_cw_events.13.a: "We need them out the country."
 ZKN_post_cw_events.13.b: "Only remove proven insurrectionists."
 ZKN_post_cw_events.13.c: "This goes too far, they are still our citizen!"

 ZKN_post_cw_events.14.t: "National Reconstruction"
 ZKN_post_cw_events.14.desc: "WIP"
 ZKN_post_cw_events.14.a: "This is gonna be expensive..."
 ZKN_post_cw_events.14.tt: "Reconstruction Time is based on £GFX_occupation_costs §YAristocratic Loyalty§!."

 ZKN_post_cw_events.15.t: "National Reconstruction"
 ZKN_post_cw_events.15.desc: "WIP"
 ZKN_post_cw_events.15.a: "We will make Gardenia Great Again!"

 ZKN_post_cw_events.16.t: "National Reconstruction?"
 ZKN_post_cw_events.16.desc: "WIP"
 ZKN_post_cw_events.16.a: "Those foolish peasants will do our work for us."

 ZKN_post_cw_events.17.t: "Elbian Refugees"
 ZKN_post_cw_events.17.desc: "News from the Gardenian border as patrols report a massive influx of Elbian refugees. Apparently, the Gardenian government has launched some sort of operation against their native Elbian population, expulsing them from their homelands, causing waves of refugees to cross the borders."
 ZKN_post_cw_events.17.a: "What is going on in Gardenia?"

 ZKN_post_cw_events.18.t: "The Anti-Military Apparatus"
 ZKN_post_cw_events.18.desc: "WIP"
 ZKN_post_cw_events.18.a: "Can't they just accept their defeat?"


