 ZKN_events.7.t: "Gardenia demands Vassalisation"
 ZKN_events.7.desc: "WIP"
 ZKN_events.7.a: "We bow before the Vanquisher."
 ZKN_events.7.b: "You are pathetic! Die!"
 ZKN_events.7.c: "Ready the Army! We march to Gartenstadt!"

 ZKN_events.8.t: "[FROM.Capital.GetCapitalVictoryPointName] swears Fealty"
 ZKN_events.8.desc: "WIP"
 ZKN_events.8.a: "Your loyalty to the Pact will be rewarded."

 ZKN_events.9.t: "[FROM.Capital.GetCapitalVictoryPointName] defies the Crown"
 ZKN_events.9.desc: "WIP"
 ZKN_events.9.a: "Crush them all!"

 ZKN_events.10.t: "Fate of the False Duke"
 ZKN_events.10.desc: "Contrary to his expectations, Corwin Esta was not headed for execution or prison. Instead, he stood baffled before the Gardenian ambassador, not believing his ears.\n \n«You're saying I... am to continue to rule?»\n \n«Yes.», the diplomat studied his Gegenübers expressions.\n \n«You will head the Chrysean Mandate Government as its monarch. Despite misgivings, you have proven to the Zinnian Throne to be capable of adapting to conditions and we hope you will also come to prove your loyalty as well.» Esta bowed his head."
 ZKN_events.10.a: "Let's hope we can trust him."

 ZKN_events.11.t: "[FROM.GetNameDefCap] demands Proof of Non-Aggression"
 ZKN_events.11.desc: "WIP"
 ZKN_events.11.a: "We have no quarrel with [FROM.Capital.GetCapitalVictoryPointName]."
 ZKN_events.11.b: "This is clearly a trick!"

 ZKN_events.12.t: "[FROM.GetNameDefCap] accepts Non-Aggression Pact"
