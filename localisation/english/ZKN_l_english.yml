 ZKN_events.14.t: "End of Civilian Administration"
 ZKN_events.14.desc: "WIP"
 ZKN_events.14.a: "The military stands divided."

 ZKN_events.15.t: "Degretschow appointed Plenipotentiary for Propaganda"
 ZKN_events.15.desc: "WIP"
 ZKN_events.15.a: "'Finally, an office job!'"

 ZKN_events.16.t: "Ousting the Marshal"
 ZKN_events.16.desc: "WIP"
 ZKN_events.16.a: "Ostersee has the expertise."
 ZKN_events.16.b: "Von Degretschow secures the seat of power."


 ZKN_news_events.1.t: "Loyalists win the Gardenian Civil War"
 ZKN_news_events.1.desc: "The Gardenian Civil War has come to an end, with the loyalists of the Zinnian Throne managing to successfully crush the Republican Revolution.\n \nThe restored Kingdom is however still incredibly unstable, with the Zinnian Throne fighting for the loyalty of the Armed Forces and the Aristocracy, which both increased their influence during the Civil War. Wether or not the crown can hold onto power in the next few months remains to be seen."
 ZKN_news_events.1.a: "Heil König dir!"
 ZKN_news_events.1.b: "$ZLF_news_events.1.b$"

 ZKN_news_events.2.t: "Military Coup in Gardenia"
 ZKN_news_events.2.desc: "The Salvationist Clique of the Royal Armed Forces under leadership of Peter von Tretschau have seized control over Gardenia, deposing King Michael and establishing the Government of National Salvation.\n \nThe newly-proclaimed stratocracy has however already seen increasing resistance as the aristocracy attempt to subvert military control over the nation and establish a legitimate regency council for the king-less kingdom."
 ZKN_news_events.2.a: "Geh beiseite, der Boss kommt!"

 ZKN_news_events.3.t: "Gardenian Regency Established"
 ZKN_news_events.3.desc: "The Gardenian Aristocrats, led by Komtesse Yvonne von Karmesin, have successfully subverted military control, executing the leaders of the Salvation Clique and other disloyal army officers.\n \nIt is uncertain how the nobles were able to so quickly, with some even speculating foreign interference. Nonetheless, the military junta has been eliminated and the newly establish Crimson Regency has consolidated control over the nation."
 ZKN_news_events.3.a: "And all shall return to normalcy..."


