 ZLF_elbian_lands_desc: "These lands are home to the Elbs, the long-eared, longer-lived relatives of humanity. Nature-loving by culture, they vehemently oppose the industrialisation of their homelands, which earned them scorn from the Zinnian Throne, the greedy aristocracy and the industrial elite."
