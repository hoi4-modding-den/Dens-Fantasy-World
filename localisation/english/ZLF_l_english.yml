 ZLF_elbian_autonomy_1: "Elbian Autonomy (Freistaat Domowina)"
 ZLF_elbian_autonomy_1_desc: "The Free State of Domowina is the largest of the three autonomous states, located in the Domowina Forest and reaching all the way to the Eastern borders in Schweidnitz and Quellenjebiet."
 ZLF_elbian_autonomy_2: "Elbian Autonomy (Freistaat Wjelećina)"
 ZLF_elbian_autonomy_2_desc: "The Elbian population of the Free State of Wjelećina is mostly comprised of descendants of refugees who fled from the lawless lands of Alstroemeria, though a native Elbian population existed in the state before them."
 ZLF_elbian_autonomy_3: "Elbian Autonomy (Freistaat Rudne Horiny)"
 ZLF_elbian_autonomy_3_desc: "The Free State of Rudne Horiny encompasses the Elbian lands in the Erzgebirge, whose Elbian name is Rudne Horiny."
