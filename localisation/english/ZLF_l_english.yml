# IDEAS

 ZLF_edelweiss_banner: "The Edelweiss Banner-Army"
 ZLF_edelweiss_banner_desc: "The Edelweiss Banner-Army is a revolutionary association of republican groups who came together to fulfill their common goal of overthrowing the Zinnian Throne, the monarchy of Gardenia."
 ZLF_defense_of_gardenia: "Gardenian Defence Corporation"
 ZLF_red_guards: "The Red Guards"
 ZLF_anti_monarchist_campaign: "The Anti-Monarchist Campaign"
 ZLF_hosting_exiled_royals: "Zinnian Royals in Exile"
 ZLF_hosting_exiled_royals_desc: "The Royal Family of Gardenia was allowed to go into exile in [ROOT.GetNameDef]. While they do not actively attempt to undermine the Republic in fear of retaliation, they may make good figureheads for a client state should we attempt to conquer Gardenia."
 ZLF_hosting_exiled_royals_tt: "If we capitulate §Y[ZLF.GetNameWithFlag]§!, we will automatically establish a §YPuppet Monarchy§!."
 ZLF_staatsbankrott: "End of the Adelswirtschaft"
 ZLF_staatsbankrott_desc: "The exploitation of the people through the aristocracy has been ended. However, in the heat of revolution, the thoroughness of our troops has caused significant damage to our economic capabilities."
 ZLF_upset_industrialists: "Apprehensive Capitalists"
 ZLF_upset_industrialists_desc: "While not opposed to a republican revolution, many industrialists fear that the socialist influence on the major revolutionary factions will lead to them being expropriated and killed."
 ZLF_economic_downturn: "Planlosigkeit"
 ZLF_economic_downturn_desc: "Our economy was significantly hurt by the civil war, but our economists are not certain what approach will assist in reconstruction. Our industrial planning is in a state of limbo. We are planlos."
