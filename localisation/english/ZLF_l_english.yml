# EVENTS

 ZLF_cw_events.1.t: "Army Morale falters"
 ZLF_cw_events.1.desc: "Failure to complete special objectives given by Liberation Army Command have affected the morale of our troops."
 ZLF_cw_events.1.a: "We must press on..."

 ZLF_cw_events.2.t: "Army Morale falters severely"
 ZLF_cw_events.2.a: "We will recover..."

 ZLF_cw_events.3.t: "Hortensian Aid"
 ZLF_cw_events.3.desc: "With the roads to Hortensia secure, we were able to negotiate with various aligned groups in the city to garner their support."
 ZLF_cw_events.3.a: "Gott sei Dank."

 ZLF_cw_events.4.t: "Revolutionary Victory"
 ZLF_cw_events.4.desc: "The Banner-Armies of Edelweiss have defeated the Royal Armed Forces. The nobility has largely fled the country and King Michael has been detained after the capture of Zinnienschloss. The revolution is victorious."
 ZLF_cw_events.4.a: "With the monarchists vanquished, we can begin reconstruction."

 ZLF_cw_events.5.t: "International Brigades head home"
 ZLF_cw_events.5.desc: "With the civil war over, the International Brigades have been disbanded and the volunteers are on the way back home."
 ZLF_cw_events.5.a: "Auf Wiedersehen, Genossen!"


 ZLF_post_cw_events.1.t: "The Constitutional Convention"
 ZLF_post_cw_events.1.desc: "WIP"
 ZLF_post_cw_events.1.a: "Democracy will entrench itself!"

 ZLF_post_cw_events.2.t: "Constitutional Convention - Divisions of Power"
 ZLF_post_cw_events.2.desc: "WIP"
 ZLF_post_cw_events.2.a: "Federalism it is!"

 ZLF_post_cw_events.3.t: "Constitutional Convention - The Chancellery"
 ZLF_post_cw_events.3.desc: "WIP"
 ZLF_post_cw_events.3.a: "We must prevent a Gerontocracy at all costs."
 ZLF_post_cw_events.3.tt: "§gThis will affect the outcome of future elections.§!"
 ZLF_post_cw_events.3.b: "We cannot possibly limit who can run for chancellor!"

 ZLF_post_cw_events.4.t: "Split in the Party"
 ZLF_post_cw_events.4.desc: "With the end of the constitutional convention ongoing, the divisions within the National Democratic Party have become much more apparent. Without the monarchists as a common enemy, the factions have ended their Burgfrieden and the party has split.\n \nThe leftist factions, especially the Trade Unionists and the Social Democrats, have decided to officially leave the party and found their own, named the Socialist Party. Even the prominent revolutionary, Roland Ludovik, has decided to join them, abandoning the NDPvG. Meanwhile on the right side, the more liberal elements of the party have decided to break away and found the Gardinian Constitutional Party as a counterweight to the leftists."
 ZLF_post_cw_events.4.a: "A plurality of opinions must be supported."

 ZLF_post_cw_events.5.t: "Closing Speech of the Constitutional Convention"
 ZLF_post_cw_events.5.desc: "WIP"
 ZLF_post_cw_events.5.a: ""

 ZLF_post_cw_events.6.t: "First Elections of the Republic"
 ZLF_post_cw_events.6.desc: "WIP"
 ZLF_post_cw_events.6.a: "The Sozialistische Partei wins the mandate!"
 ZLF_post_cw_events.6.b: "The NDRvG manages to convince the people!"
 ZLF_post_cw_events.6.c: "The Radical Transformative Party somehow wins?"

 ZLF_post_cw_events.7.t: "Rebuilding the Nation"
 ZLF_post_cw_events.7.desc: "WIP"
 ZLF_post_cw_events.7.a: "The Republic must resuscitate it civilian life."


 ZLF_events.1.t: "Lingua Internacia"
 ZLF_events.1.desc: "Our government has received an interesting petition from a doctor in Welsen. The medical practitioner Dr. Luis Lazarus Zaunenbach is a hobby language enthusiast and the creator of a new language, the lingua internacia, though it is commonly referred to as Esperanto by its speakers. He proposes we use Esperanto as the official language of diplomacy and convincing other nations to do the same. While his ideas seem utopian at the moment, it appeals to exactly the kind of idealism our Republic was founded upon."
 ZLF_events.1.a: "Ĉu tion ni serĉas?"


 ZLF_news_events.1.t: "Revolutionaries win the Gardenian Civil War"
 ZLF_news_events.1.desc: "The Gardenian Civil War has come to an end, with the revolutionaries of the Edelweiss Banner-Army managing to successfully overthrow the Zinnian Monarchy.\n \nThe new republic has already begun to establish itself in the region, preparing to send unutilised military equipment to democratic forces in the north and making moves to align the Free City of Hortensia. But before Gardenia re-enters the geopolitical stage, they will first have to look inward and recover from the devastation of the civil war."
 ZLF_news_events.1.a: "Für das Volk!"
 ZLF_news_events.1.b: "At last the bloodshed is over."


