 ZLF_secure_alstroemeria: "Restore Law and Order in Alstroemeria"
 ZLF_secure_alstroemeria_desc: "The lawless lands of Alstroemeria are de-jure controlled by the Order of the Five Towers, with most of its land under no control of an actual government. We must end this increaturous magocratic experiment."
