 ZLF_dawn_of_the_republic: "Sunset for the Zinnian Throne"
 ZLF_dawn_of_the_republic_desc: "The Reactionary Forces of the Zinnian Throne have been defeated. The Republic endures."
 ZLF_dawn_of_the_republic_tt: "The §YLiberation Front§! will be reorganised into a proper §YRepublic§!, a §Yconstitutional convention§! will be held and preparations for §Yelections§! will be made."
 
 ZLF_magic_polygon_of_economics: "Polygon of Economics"
 ZLF_magic_polygon_of_economics_desc: "The Magic Polygon (de.: Magisches Vieleck), also referred to as the Magic Square or Magic Hexagon, is system of four to six political economic goals who are supposed to be completed at the same time."
 
 ZLF_theories_of_international_relations: "Theories of International Relations"
 ZLF_theories_of_international_relations_desc: "The international system is build up based on the principle of anthropromorphic difference. Societies who have higher collective potential (measure of organising labour) than others end up dominating and exploiting those weaker societies. This international system is dysfunctional, as it ends up reducing global collective potential."
