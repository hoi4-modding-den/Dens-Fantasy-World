 ZLF_establish_celandra_sibling_republic: "Establish a Celandran Sibling Republic"
 ZLF_establish_celandra_sibling_republic_desc: "The People of Celandra are tired of monarchist tyranny. Thus, we will establish a Sibling Republic, following the ideals of the Edelweiss Revolution."
 ZLF_establish_celandra_sibling_republic_tt: "Release §Y$ZLF_celandra_republic$§! in §YHighlighted States§! controlled by us."
 ZLF_transfer_state_to_celandra_sb: "Transfer [FROM.GetName] to our Celandran Allies"
 ZLF_establish_orchidee_sibling_republic: "Establish an Orchidean Sibling Republic"
 ZLF_establish_orchidee_sibling_republic_desc: "The Northern lands lying between the Einöde and Celandra Proper are known as Orchidee in Gardenian. It should therefore only be proper to grant them their own Sibling Republic, independent from Celandra."
 ZLF_establish_orchidee_sibling_republic_tt: "Release §Y$ZLF_orchidee_republic$§! in §YHighlighted States§! controlled by us."
 ZLF_transfer_state_to_orchidee_sb: "Transfer [FROM.GetName] to our Orchidean Allies"
 ZLF_establish_elotropia_sibling_republic: "Establish an Elotropian Sibling Republic"
 ZLF_establish_elotropia_sibling_republic_desc: "The chaotic regions known in Gardenian as Elotropien and in their native language as the Balekelemi region has significantly destabilised, even moreso than Gardenia. To help them back on the right path, a Republican Administration is needed."
 ZLF_establish_elotropia_sibling_republic_tt: "Release §Y$ZLF_balekelemi_republic$§! in §YHighlighted States§! controlled by us."
 ZLF_transfer_state_to_elotropia_sb: "Transfer [FROM.GetName] to our Elotropian Allies"
 ZLF_establish_korelia_sibling_republic: "Establish a Korelian Sibling Republic"
 ZLF_establish_korelia_sibling_republic_desc: "Korelia, in a way, is Gardenian too. But instead of attempting to integrate them into our Republic, we shall grant them an independent Sibling Republic, instead only directly integrating the small border region of Linden, where Gardenian natives are most common."
 ZLF_establish_korelia_sibling_republic_tt: "Release §Y$ZLF_korelia_republic$§! in §YHighlighted States§! controlled by us."
