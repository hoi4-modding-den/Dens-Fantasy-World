# IDEOLOGIES

 neorevisionism: "Neorevisionism"
 neorevisionism_desc: "Neorevisionism is a sort of radicalised reformism, whose adherents advocate moving away from solely worker-oriented politics to a party of the whole people. They differ from reformists by pushing for adopting various active methods of defending democracy, such as populism, a greater focus on paramilitary organisations and bold symbols that convey the power of the movement, such as the burning fist of the Edelweiss Banner-Army. In broad terms, Neorevisionism is a populist current within the social democratic movement."
 environmentalism: "Environmentalism"
 environmentalism_desc: "Environmentalism advocates the preservation, restoration and improvement of the natural environment and critical earth system elements or processes such as the climate, and may be referred to as a movement to control pollution or protect plant and animal diversity."
 moralism: "Moralism"
 moralism_desc: "Moralism is a philosophy that concerns itself with imbuing society with a certain set of 'morals'. It is deeply rooted in the right wing of the harmonist movement and holds weight among the educated middle-class as a conservative, traditionalist and pacifistic ideology."
 autonomist_marxism: "Autonomist Marxism"
 autonomist_marxism_desc: "Autonomist Marxism, or simply Autonomism, is a school of Marxist thought that emphasises the ability of the working class to force changes in the capitalist system and bring about a post-capitalist society through its autonomous activity. This perspective sees class struggle, rather than objective economic laws, as the primary driving force of history. Key concepts within Autonomist Marxism include the refusal of work, class composition, the social factory, and self-valorization."
 council_communism: "Councilism"
 council_communism_desc: "Council communism or Councilism is a school of Marxist thought that is opposed to state socialism and advocates for workers' councils and council democracy, with elements influenced by syndicalism. Most councilists oppose parliamentarianism, though it is not a necessary part of the ideology, as proven by Gardenian Councilists whose electorial program does not include the dissolution of parliament."
 gardenian_ultranationalism: "Gardenian Ultranationalism"
 gardenian_ultranationalism_desc: "The concept of the Gardenian ultranation is extremely popular among the far-right parties of Gardenia, seeking to restore the 'former glory' of the region, even if such a past never truly existed. Most adherents of Gardenian Ultranationalism also seek to implement single-party autocracy, corporatism and kratocratic principles."

 #ZLF_socialism_desc: "The NDPvG is the foremost advocate for democratic revolution in Gardenia, fighting for a united Gardenian republic, social democracy and social liberalism."


