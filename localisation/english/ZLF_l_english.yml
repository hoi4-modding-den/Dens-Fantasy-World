 ZLF_establish_celandra_sibling_republic: "Establish a Celandran Sibling Republic"
 ZLF_establish_celandra_sibling_republic_desc: "The People of Celandra are tired of monarchist tyranny. Thus, we will establish a Sibling Republic, following the ideals of the Edelweiss Revolution."
 ZLF_transfer_state_to_celandra_sb: "Transfer [FROM.GetName] to our Celandran Allies"
 ZLF_establish_orchidee_sibling_republic: "Establish an Orchidean Sibling Republic"
 ZLF_establish_orchidee_sibling_republic_desc: "The Northern lands lying between the Einöde and Celandra Proper are known as Orchidee in Gardenian. It should therefore only be right to grant them their own Sibling Republic, independent from Celandra."
 ZLF_transfer_state_to_orchidee_sb: "Transfer [FROM.GetName] to our Orchidean Allies"
 ZLF_establish_einoede_sibling_republic: "Establish an Einöde Sibling Republic"
 ZLF_establish_einoede_sibling_republic_desc: "The region known in Gardenian as Einöde is locally also known as Chrysea. That name is however associated with the authoritarian empire that once controlled the region and thus we will refrain from using it. The people of the Einöde may at first call it colonialism, but rest assured that their government will be free to elect whomever they want."
 ZLF_transfer_state_to_einoede_sb: "Transfer [FROM.GetName] to our Ödnean Allies"
 ZLF_establish_elotropia_sibling_republic: "Establish an Elotropian Sibling Republic"
 ZLF_establish_elotropia_sibling_republic_desc: "The chaotic regions known in Gardenian as Elotropien and in their native language as the Balekelemi region has significantly destabilised, even moreso than Gardenia. To help them back on the right path, a Republican Administration is needed."
 ZLF_transfer_state_to_elotropia_sb: "Transfer [FROM.GetName] to our Elotropian Allies"
 ZLF_establish_korelia_sibling_republic: "Establish a Korelian Sibling Republic"
 ZLF_establish_korelia_sibling_republic_desc: "Korelia, in a way, is Gardenian too. But instead of attempting to integrate them into our Republic, we shall grant them an independent Sibling Republic, instead only directly integrating the small border region of Linden, where Gardenian natives are most common."
 ZLF_transfer_state_to_korelia_sb: "Transfer [FROM.GetName] to our Korelian Allies"
 ZLF_establish_avalon_sibling_republic: "Establish an Avalonian Sibling Republic"
 ZLF_establish_avalon_sibling_republic_desc: "Avalon is an interesting case. The Knights of the Round Table are a nominally democratic institution, but with the formation of an Avalonian republic, certain public figures have stepped up to form political parties to participate in the democratic process."
 ZLF_transfer_state_to_avalon_sb: "Transfer [FROM.GetName] to our Avalonian Allies"
 ZLF_establish_wealas_sibling_republic: "Establish a Wēalan Sibling Republic"
 ZLF_establish_wealas_sibling_republic_desc: "WIP" #until some lore is developed
 ZLF_transfer_state_to_wealas_sb: "Transfer [FROM.GetName] to our Wēalan Allies"
 ZLF_establish_paam_sibling_republic: "Establish a Paam Sibling Republic"
 ZLF_establish_paam_sibling_republic_desc: "The Pan-Specific was a most unstable democracy, its flaws visible for the world to see. However, its principles of democratic self-determination are to be respected. The new Commonweal will learn from the mistakes of the past while keeping what worked well."
 ZLF_transfer_state_to_paam_sb: "Transfer [FROM.GetName] to our Paam Allies"
 ZLF_establish_immernoch_sibling_republic: "Establish an Immernoch Sibling Republic"
 ZLF_establish_immernoch_sibling_republic_desc: "WIP"
 ZLF_transfer_state_to_immernoch_sb: "Transfer [FROM.GetName] to our Immernoch Allies"
 ZLF_establish_wighardia_sibling_republic: "Estalbish a Wighardian Sibling Republic"
 ZLF_establish_wighardia_sibling_republic_desc: "The Birthplace of Karl Marx, Wighardia was once the centre of International Socialism. That changed when the Gardenian Revolution broke out and Socialists gravitated to the new major free state in the southern centre of Teware. Nonetheless, Wighardia shall forever be remembered as the home of Marxism."
