 ZLF_trust_in_cains: "Trust in Cains"
 ZLF_trust_in_cains_desc: "The economist Johann Möglich Cains has drafted a plan to revitalise the economy. Emphasising the need to increase the purchasing power of the workers to restore trust in the economy after the civil war, he has proposed large-scale public works to create employment. These programs are to be made possible through deficit spending."
