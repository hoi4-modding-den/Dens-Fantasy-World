 ZLF_space_socialism_desc: "Combining various progressive social-liberal and democratic socialist principles, Socialism Ad Astra — or more commonly 'Space Socialism' or 'Utopian Democratic Socialism' — advocates for a steady transformation of society towards a communist one. The government focuses its efforts on improvements in scientific development, labour laws, land reform and general societal change. It is characterised by its integration of magic and technology.\n\n“By the time communism will be achieved, creaturekind will have established its place among the stars.”"
