 ZLF_GATHERING_STORM_DESC: "The Kingdom of Gardenia has devolved into civil war with the outbreak of the Edelweiss Revolution.\n \nThe Edelweiss Liberation Front, adopting the name from the Gardenian capital region, is a broad coalition of anti-monarchist groups led by the National Democratic Party of Gardenia and the Socialist Revolutionary Roland Ludovik. The Liberation Front seeks to cast off the shackles of the feudal order which existed under Zinnian dominion, establishing a democratic republic and uniting the Gardenian nation."

