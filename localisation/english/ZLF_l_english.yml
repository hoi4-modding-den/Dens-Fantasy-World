 ZLF_trust_in_marx: "Trust in Marx"
 ZLF_trust_in_marx_desc: "Marxism is the main doctrine of the NDPvG and the RTP, following the theories of Wighardian economic theorist Karl Marx. Implementation of Marxian economics and the nationalisation of the industry has been the plan since the beginning of the revolution."
