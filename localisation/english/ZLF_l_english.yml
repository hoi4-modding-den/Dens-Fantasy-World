 ZLF_edelweiss_banner: "The Edelweiss Banner-Army"
 ZLF_edelweiss_banner_desc: "The Edelweiss Banner-Army is a revolutionary association of republican groups who came together to fulfill their common goal of overthrowing the Zinnian Throne, the monarchy of Gardenia."
 ZLF_anti_monarchist_campaign: "The Anti-Monarchist Campaign"
 ZLF_staatsbankrott: "End of the Adelswirtschaft"
 ZLF_staatsbankrott_desc: "The exploitation of the people through the aristocracy has been ended. However, in the heat of revolution, the thoroughness of our troops has caused significant damage to our economic capabilities."
