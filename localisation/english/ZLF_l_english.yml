# EVENTS

 ZLF_placeholder_events.1.t: "Warning! Unfinished Content!"
 ZLF_placeholder_events.1.desc: "Due to time constraints, the content of this nation is unfinished. I suggest instead playing the Edelweiss Liberation Front as the one country with finished content I made.\n \nThe Alstroemerian Magocracy is currently missing a proper ending. You can play up to the final focus in the currently visible focus tree and either select the option loading the unfinished epilogue tree or start a war against all other countries, with no scripted end."
 ZLF_placeholder_events.1.a: "I understand."
 ZLF_placeholder_events.1.b: "Take me to the Liberation Front"
 ZLF_change_possible_only_day_1_tt: "Changing the country is only possible before unpausing."

 ZLF_placeholder_events.2.desc: "Due to time constraints, the content of this nation is unfinished. I suggest instead playing the Edelweiss Liberation Front as the one country with finished content I made.\n \nThe City of Hortensia has multiple foci missing effects and no concrete ending. The fascist path is currently non-existant and the communist and liberal paths are both significantly lacking."

 ZLF_placeholder_events.3.desc: "Due to time constraints, the content of this nation is unfinished. I suggest instead playing the Edelweiss Liberation Front as the one country with finished content I made.\n \nThe Zinnian Dominion currently only has finished content for the Military Government after the Civil War and an unfinished shared conquest branch.\n \nPATH GUIDE: If you do want to play as the Military, have the coup succeed and then shut down the nobles by force."



 ZLF_cw_events.1.t: "Army Morale falters"
 ZLF_cw_events.1.desc: "Failure to complete special objectives given by Liberation Army Command have affected the morale of our troops."
 ZLF_cw_events.1.a: "We must press on..."

 ZLF_cw_events.2.t: "Army Morale falters severely"
 ZLF_cw_events.2.a: "We will recover..."

 ZLF_cw_events.3.t: "Hortensian Aid"
 ZLF_cw_events.3.desc: "With the roads to Hortensia secure, we were able to negotiate with various aligned groups in the city to garner their support."
 ZLF_cw_events.3.a: "Gott sei Dank."

 ZLF_cw_events.4.t: "Revolutionary Victory"
 ZLF_cw_events.4.desc: "The Banner-Armies of Edelweiss have defeated the Royal Armed Forces. The nobility has largely fled the country and King Michael has been detained after the capture of Zinnienschloss. The revolution is victorious."
 ZLF_cw_events.4.a: "With the monarchists vanquished, we can begin reconstruction."

 ZLF_cw_events.5.t: "International Brigades head home"
 ZLF_cw_events.5.desc: "With the civil war over, the International Brigades have been disbanded and the volunteers are on the way back home."
 ZLF_cw_events.5.a: "Auf Wiedersehen, Genossen!"

 ZLF_cw_events.6.t: "Republican Exiles from Gardenia"
 ZLF_cw_events.6.desc: "With the Liberation Front defeated, most of the Republican leaders have gone into exile to escape persecution and further the Republican cause abroad. Apparently a large part of those exiles has found a home here in [ROOT.GetNameDef]."
 ZLF_cw_events.6.a: "Let us hope this doesn't cause us conflict with Gardenia."

 ZLF_cw_events.7.t: "The Free Elb"
 ZLF_cw_events.7.desc: "A mysterious traveller has arrived. The Elb introduced himself as $ZSP_krabat_name$, commander of the Domowina Order of Alstroemeria. He and his knights were driven away due to political manouvres by the Master of the Schadow Tower, who got rid of them by sending them to fight against a powerful ogre. Janko recognised it as a trap and instead escaped the region, fleeing through the war-torn lands of Gardenia and finally reaching our lines."
 ZLF_cw_events.7.a: "What is going on in that place?"

 ZLF_cw_events.8.t: "Der Rasende Roland"
 ZLF_cw_events.8.desc: "As the main commander of the Liberation Front, Ludovik has been planning the Revolution for years. With the defeat of the reactionaries now in sight, his strategies of quick warfare has earned him the name 'Rasender Roland', furious Roland, among the troops."
 ZLF_cw_events.8.a: "Immer Schneller!"
 ZLF_cw_events.8.tt: "$army_speed_factor_tt$ §G+15.00%§!\n$org_loss_when_moving_tt$ §G-25.0%§!\n$MODIFIER_WOUNDED_CHANCE_FACTOR$: §R+5.0%§!"


 ZLF_post_cw_events.1.t: "The Constitutional Convention"
 ZLF_post_cw_events.1.desc: "For the first time in Gardenian history, representatives of the people from all over the region have gathered together in Gartenstadt to write a constitution for Gardenia. The future of Gardenia lies in the hands of the revolutionary delegates."
 ZLF_post_cw_events.1.a: "Democracy will entrench itself!"

 ZLF_post_cw_events.2.t: "Constitutional Convention - Divisions of Power"
 ZLF_post_cw_events.2.desc: "WIP"
 ZLF_post_cw_events.2.a: "Federalism it is!"

 ZLF_post_cw_events.3.t: "Constitutional Convention - The Chancellery"
 ZLF_post_cw_events.3.desc: "WIP"
 ZLF_post_cw_events.3.a: "We must prevent a Gerontocracy at all costs."
 ZLF_post_cw_events.3.tt: "§gThis will affect the outcome of future elections.§!"
 ZLF_post_cw_events.3.b: "We cannot possibly limit who can run for chancellor!"

 ZLF_post_cw_events.4.t: "Split in the Party"
 ZLF_post_cw_events.4.desc: "With the end of the constitutional convention ongoing, the divisions within the National Democratic Party have become much more apparent. Without the monarchists as a common enemy, the factions have ended their Burgfrieden and the party has split.\n \nThe labour factions, the Trade Unionists and the Cooperativists, have decided to officially leave the party and found their own, named the Socialist Party. Even the prominent revolutionary, Roland Ludovik, has decided to join them, abandoning the NDPvG. Meanwhile on the right side, the more liberal elements of the party have decided to break away and found the Gardinian Constitutional Party as a counterweight to the leftists."
 ZLF_post_cw_events.4.a: "A plurality of opinions must be supported."
 ZLF_post_cw_events.4.tt: "The §YSocialists§! are guaranteed to win the next elections. The §YGKP§! will be relegated to the §YOpposition§!, but its time may come."

 ZLF_post_cw_events.5.t: "Closing Speech of the Constitutional Convention"
 ZLF_post_cw_events.5.desc: "WIP"
 ZLF_post_cw_events.5.a: "To a peaceful future!"

 ZLF_post_cw_events.6.t: "First Elections of the Republic"
 ZLF_post_cw_events.6.desc: "WIP"
 ZLF_post_cw_events.6.a: "The NDPvG manages to convince the people!"
 ZLF_post_cw_events.6.b: "The Sozialistische Partei wins the mandate!"
 ZLF_post_cw_events.6.c: "The Radikale Transformative Partei gets a majority!"
 ZLF_post_cw_events.6.tt: "The other two §Yleftist parties§! and the §YMinority Bloc§! will join us in a §YPopular Front§! coalition."

 ZLF_post_cw_events.7.t: "Rebuilding the Nation"
 ZLF_post_cw_events.7.desc: "WIP"
 ZLF_post_cw_events.7.a: "The Republic must resuscitate it civilian life."

 ZLF_post_cw_events.8.t: "Fate of the Royal Army"
 ZLF_post_cw_events.8.desc: "WIP"
 ZLF_post_cw_events.8.a: "Grant amnesty to some of the less ideological generals."
 ZLF_post_cw_events.8.b: "We cannot accept those traitors into our ranks."

 ZLF_post_cw_events.9.t: "Fate of the Aristocracy"
 ZLF_post_cw_events.9.desc: "WIP"
 ZLF_post_cw_events.9.a: "Seize their assets and hang them!"

 ZLF_post_cw_events.10.t: "Fate of the Royal Family"
 ZLF_post_cw_events.10.desc: "WIP"
 ZLF_post_cw_events.10.a: "A court will find them guilty of treason."
 ZLF_post_cw_events.10.b: "Show leniency. Exile them to Celandra."
 ZLF_post_cw_events.10.c: "Perhaps they can be rehabilitated?"

 ZLF_post_cw_events.11.t: "The Gardenian Exiles"
 ZLF_post_cw_events.11.desc: "WIP"
 ZLF_post_cw_events.11.a: "How the mighty have fallen."


 ZLF_events.1.t: "Lingua Internacia"
 ZLF_events.1.desc: "Our government has received an interesting petition from a doctor in Welsen. The medical practitioner Dr. Luis Lazarus Zaunenbach is a hobby language enthusiast and the creator of a new language, the lingua internacia, though it is commonly referred to as Esperanto by its speakers. He proposes we use Esperanto as the official language of diplomacy and convincing other nations to do the same. While his ideas seem utopian at the moment, it appeals to exactly the kind of idealism our Republic was founded upon."
 ZLF_events.1.a: "Ĉu tion ni serĉas?"
 ZLF_unlocked_esperanto: "Unlocked via the §Y'$ZLF_events.1.t$'§! Event"

 ZLF_events.2.t: "Elbian Insurrection"
 ZLF_events.2.desc: "WIP"
 ZLF_events.2.a: "I suppose it is our fault."
 ZLF_events.2.tt: "The §YElbian Free State§! will §Rseceede§! from us. If we do not defeat them within the §Ytime limit§!, they will gain §Yinternational recognition§! and we will be forced to grant them §gsignificant autonomy§!."
 ZLF_elbian_insurrection_happened: "the §YElbian Insurrection§! has happened"

 ZLF_events.3.t: "Forced to the Table"
 ZLF_events.3.desc: "WIP"
 ZLF_events.3.a: "We accept."

 ZLF_events.4.t: "Aid from [FROM.capital.GetCapitalVictoryPointName]"
 ZLF_events.4.desc: "WIP"
 ZLF_events.4.a: "We thank them for their support."

 ZLF_events.5.t: "The Rathenau Revelation"
 ZLF_events.5.desc: "Politicians from the National Democrats have been implicated in a scheme to funnel party funds to a private corporation in Rathenau. As part of the Popular Front Coalition leading Gardenia, this scandal has rapidly soured relations within the government, with the Radical Transformative Party calling for a Vote of No Confidence and the dissolution of parliament."
 ZLF_events.5.a: "We cannot let this happen!"
 ZLF_events.5.b: "Let the vote commence."
 ZLF_events.5.c: "Krondrache will lead a proper investigation!"
 ZLF_krondrache_uncovered_plot: "Krondrache uncovered the Radical Plot"

 ZLF_events.6.t: "Opposition Protests"
 ZLF_events.6.desc: "The prevention of the vote of no confidence riles up the liberal opposition parties and the people. The streets of the major urban centres are filled with protestors as the popularity of the Popular Front plummets."
 ZLF_events.6.a: "The government resigns, new elections are held."

 ZLF_events.7.t: "The Left-Liberal Coalition"
 ZLF_events.7.desc: "With the Liberals winning significant ground in the elections, the leftist parties are forced to form a Left-Liberal coalition, comprising the SP, the GKP and NDPvG."
 ZLF_events.7.a: "Let's see if this works."

 ZLF_events.8.t: "Vote of No Confidence"
 ZLF_events.8.desc: "The Vote of No Confidence is now to be held. While the Liberal Opposition and the RTP are guaranteed to go with the motion and the NDPvG is obviously against it, the position of the Socialist Party is currently ambivalent."
 ZLF_events.8.a: "The vote easily fails."
 ZLF_events.8.b: "The ayes have it."

 ZLF_events.9.t: "New Elections"
 ZLF_events.9.desc: "Following the end of the first Popular Front Government, new elections are held. The liberal Gardenian Constitutional Party has gained significant electorial grounds due to the affair, but even then they will require support from the moderate Socialists to form a government. Meanwhile the Socialist Party has managed to rally the people for the sake of government stability and continuing social reforms."
 ZLF_events.9.a: "The GKP wins a significant vote share!"
 ZLF_events.9.b: "The Socialist Party forms a coalition."

 ZLF_events.10.t: "Federalisation of Hortensia?"
 ZLF_events.10.desc: "WIP"
 ZLF_events.10.a: "For a better tomorrow!"
 ZLF_events.10.b: "We prefer allies over partners."
 ZLF_events.10.tt: "§YFederalisation§! will take away the ability to form §YCollaboration Governments§! and increase §YTrade Ties§! with the §YFederal Government§!. §RIt will not take away the ability to declare war.§!"

 ZLF_events.11.t: "Hortensia accepts Federalisation"
 ZLF_events.11.desc: "WIP"
 ZLF_events.11.a: "Beautiful."

 ZLF_events.12.t: "Hortensia declines Federalisation"
 ZLF_events.12.desc: "WIP"
 ZLF_events.12.a: "We do not hold it against them."

 ZLF_events.13.t: "The Question of the Navy"
 ZLF_events.13.desc: "WIP"
 ZLF_events.13.a: "Put some funding towards rebuilding it."
 ZLF_events.13.b: "The Navy is secondary to the other Branches."

 ZLF_events.14.t: "The Krondrache Report"
 ZLF_events.14.desc: "The government-requested report on the economic situation has been a wake-up call for the politicians. The report outlines three major crises within the nation.\n \n1. Deflation\nThe nation suffers from a massive deflation. This can be attributed to the royalists' sabotage of the mints. It is recommended to print more money and increase purchasing power.\n \n2. Unemployment\nDue to widespread chaos, many workers lost their job, with some even willingly giving up their work to join the Banner-Army. Right now, the Banner-Army is the biggest employer in the nation. Establishing a stable work environment, through work creation programs or otherwise, is recommended.\n \n3. GDP Growth\nThe economy has not yet fallen into depression, but it certainly has grown sluggish. While not technically immediately necessary, it is recommended to increase GDP Growth to avert a future economic crisis."
 ZLF_events.14.a: "And that's the way it is."
 ZLF_unlocked_kronkite: "Unlocked via the §Y'$ZLF_events.14.t$'§! Event"

 ZLF_events.15.t: "Rathenau Affair: Radical Plot Uncovered!"
 ZLF_events.15.desc: "Investigations by popular journalist Walter Krondrache have brought forth the truth about the Rathenau Affair!\n \nKrondrache uncovered a plot by the Authoritarian Faction of the Radical Transformative Party to sow discord within the Popular Front by revealing the lawful actions of NDPvG politicians and presenting them in a false light.\n \nWhile the Vote of No Confidence has succeeded, this revelation is sure to affect the outcome of the new elections."
 ZLF_events.15.a: "AHA! I knew Social Democracy was infallible!"

 ZLF_events.16.t: "SP forms Grand Coalition"
 ZLF_events.16.desc: "With the RTP's plot uncovered, the popularity of the Socialist Party has skyrocketed. While they are unable to form a second Popular Front, with the support from the Minority Bloc and the NDPvG, the Socialist Party will lead a Grand Coalition."
 ZLF_events.16.a: "Neorevisionism is the way forward!"

 ZLF_events.17.t: "Question of the National Defence Act"
 ZLF_events.17.desc: "With the Republic under attack, the parliament has decided to put the invocation of Clause 7b of the National Defence Act, which grants the Defence Minister various semi-dictatorial powers for the duration of the war. The RTP and the GKP, who have on multiple occasions campaigned for the removal of the clause, have protested this course of action as giving too much power to Meisendorff, fearing he might use it to commit unconstitutional actions."
 ZLF_events.17.a: "Meisendorff will defend the Republic!"
 ZLF_events.17.b: "We cannot allow this blatant Coup d'Etat!"
 ZLF_events.17.tt: "§gOnce the War is over, Elections will be held to restore parliamentarian democracy.§!"

 ZLF_events.18.t: "Meisendorff ends State of Emergency"
 ZLF_events.18.desc: "With the War over and the Republic safe, Meisendorff has ended the State of Emergency, but not before making a change to the National Defence Act, removing Clause 7b.\n \nHis actions to defend Gardenian Democracy will have him hailed as a hero."
 ZLF_events.18.a: "The SP rides the wave of Meisendorff's popularity!"
 ZLF_events.18.b: "The NDPvG will see to stable governance."

 ZLF_events.19.t: "A Sweeping Change" # incredibly unecessary, but I found it funny
 ZLF_events.19.desc: "The fate of the disgraced former king was not one of tragedy. As the palace gates closed for the day, Michael made his way to the exit. On the way out, he turned in his badge and put away his work utensils, his mop and bucket. Despite his previous role as leader of the nation, Michael was more than glad to leave the politicking to the Republicans. He had never been one for the nobility's schemes, but with no one else to lead, he had never seen a different way.\n \nAs he reached for his keys to his home, the door opened and warmth and happiness overcame him. Before him stood his roommate, the former Duke of Welsen, greeting him with a smile."
 ZLF_events.19.a: "What was that saying again?"
 ZLF_events.19.tt: "§CVerliebt, verlobt, verheiratet.§!"

 ZLF_events.20.t: "Radical Members of the Foreign Office resign"
 ZLF_events.20.desc: "WIP"
 ZLF_events.20.a: "Let them, Foreign Policy needs reasonable minds."

 ZLF_events.21.t: "NDPvG breaks Toleration of the GKP Government; New Elections"
 ZLF_events.21.desc: "The Left-Liberal Coalition had thus far continued its existence thanks to the toleration of the NDPvG. However, with the GKP's attempt to introduce a law privatising several vital industries, the National-Democrats have seen no other choice but to break toleration and force early elections.\n \nThe results of this new election are bound to be interesting, with the Radical Transformative Party polling at almost thirty percent. At the same time, the newly formed International Harmonist Party has also gained significant popularity, possibly reaching a majority by forming a coalition with and the NDPvG."
 ZLF_events.21.a: "Costeau sways the Proletariat to the RTP!"
 ZLF_events.21.a.tt: "The RTP, the SP and the Minority Bloc will form a Red Coalition."
 ZLF_events.21.b: "The RTP Autonomists win the mandate!"
 ZLF_events.21.c: "The Harmonists make significant gains and form a Republican Coalition!"
 ZLF_events.21.c.tt: "The IHP, the NDPvG and the Minority Bloc will form a Red Coalition."

 ZLF_events.22.t: "The Minority Bloc"
 ZLF_events.22.desc: "With the Elbian Population still significantly under-represented, many popular Elbian politicians have come together to form a new political party. The Minority Bloc is a merger of the primarily environmentalist Elbian Peoples' Party (Elbska Ludowa Strona) and the national-conservative Homeland Party (Domowina Strona). In accordance with legislation, the Minority Bloc, as a party that represents the minority groups of Gardenia, is guaranteed at least one seat in relevant parliaments on local, state and national levels."
 ZLF_events.22.a: "The Elbs deserve any recognition they get."

 ZLF_events.23.t: "The Solarist Faction"
 ZLF_events.23.desc: "The Socialist Party, while dominated by the Neorevisionists, is actually comprised of multiple factions, notable ones being the Labour and Reformist Factions. Another faction has now risen in membership, the so-called Solarists.\n \nThe Solarist Faction is led by Sonnenuntergang, one of the Sun Daughters that fought for the Republicans during the Revolution. Her beliefs had always been at odds with the SP mainstream, with her Harmonist tendencies opposed by the fiercely atheistic Socialists. The Solarists however are mainly concerned by impact the industrialisation of Gardenia has had on the environment. Adopting several talking points from the Minority Bloc, their priority is the protection of nature and the reorientation of energy industries to natural energy, harvested from sunlight."
 ZLF_events.23.a: "Let us build a better world."

 ZLF_events.24.t: "[FROM.GetNameDefCap] negotiates for Resource Rights"
 ZLF_events.24.desc: "WIP"
 ZLF_events.24.a: "We accept credit."
 ZLF_events.24.b: "Cash only."
 ZLF_events.24.c: "Nope."

 ZLF_events.25.t: "[FROM.GetAdjective] Resource Deal Secured!"
 ZLF_events.25.desc: "WIP"
 ZLF_events.25.a: "This is the cost of Unification."

 ZLF_events.26.t: "[FROM.GetAdjective] Resource Deal Secured!"
 ZLF_events.26.desc: "WIP"
 ZLF_events.26.a: "This is the cost of Unification."

 ZLF_events.27.t: "[FROM.GetAdjective] Authorities reject Deal"
 ZLF_events.27.desc: "WIP"
 ZLF_events.27.a: "Realpolitik isn't everything it's talked up to be."

 ZLF_events.28.t: "ITS MAY"
 ZLF_events.28.desc: "If you see this, something broke"
 ZLF_events.28.a: "This shouldnt affect anything"

 ZLF_events.29.t: "International Workers' Day Celebrations"
 ZLF_events.29.desc: "Celebrations for May Day are already underway, with millions taking to the streets of [ROOT.capital.GetCapitalVictoryPointName] to both celebrate successes of the Labour Movement and criticise the government for various questionable decisions made in recent years."
 ZLF_events.29.a: "Wir sind das Bauvolk der kommenden Welt!"

 ZLF_events.30.t: "When The Moon's Reaching Out Stars"
 ZLF_events.30.desc: "In the ruins of Alstroemeria, one man has continued to resist the Ozymandian empire. While the schadow sorcerer tried to subjugate all he saw, the Phoenix had been disrupting all attempts to fully destroy his homelands.\n \nFollowing the execution of Ozymandias, the Phoenix has approached us, wishing for the restoration of the Sternenwarte. While all of his fellow apprentices were murdered by Ozymandias during his rise to power, he still hopes to revive the power of Magic."
 ZLF_events.30.a: "Alstroemerian Magic is a cultural practice, we can't just let it die."

 ZLF_events.31.t: "Preparations for the First Continental Election"
 ZLF_events.31.desc: "WIP\n \nTewarean Marxist Parties unite into a single party, the Marxist Civic Union, other major Parties are the Socialist Party and International Harmonist Party."
 ZLF_events.31.a: "Democracy on a scale never before seen."

 ZLF_events.32.t: "The Socialist Party Candidate"
 ZLF_events.32.desc: "The Socialist Party has had significant influence since the very beginning. At last, it has completely overcome the National-Democrats, with the NDPvG now defunct.\n \nThe Neorevisionists continue following Meisendorff's manual to winning elections and reforming society, though Meisendorff himself has recently retired as Defence Minister and party leader.\n \nThe Moderates believe that the neorevisionist course has caused significant damage to the democratic process, with populism too significant a factor over actual policies. Otherwise, they tow the party line.\n \nThe Solarists gained significant popularity among the many nature-loving races of Teware, giving them actual chances of securing a nomination."
 ZLF_events.32.a: "The Neorevisionists"
 ZLF_events.32.b: "The Moderates"
 ZLF_events.32.c: "The Solarists"

 ZLF_events.33.t: "The International Harmonist Union Candidate"
 ZLF_events.33.desc: "The IHP is by far the most right-leaning party among the possible victors.\n \nThe Moralists are the biggest faction within the party, fighting for further integration of moralism into civic life.\n \nThe Economic Faction is the liberal wing of the IHP, seeking increased civil liberties and a decrease in government intervention, even if a full end of the centralised economy that was built up after the revolution is unlikely to be achieved any time soon.\n \nThe Conservatives are led by former NVP chairman Wilhelm Glücksburg, an ardent advocate for austerity measures, making him unpopular among the workers and the left."
 ZLF_events.33.a: "The Moralists"
 ZLF_events.33.b: "The Economic Faction"
 ZLF_events.33.c: "The Conservationists"

 ZLF_events.34.t: "The Marxist Civic Union Candidate"
 ZLF_events.34.desc: "The Marxist Civic Union is surprisingly stable despite being a union of various marxist and marxist-aligned parties from across Teware.\n \nThe Centre is dominated by former politicians from the Radical Transformative Party, as chairman Mai's interpretation of Marxism is considered the 'orthodox' current.\n \nThe Autonomists are popular especially with races who were a minority within their original country for leading various freedom movements, not least the Elbian Liberation Army.\n \nThe Conciliators seek to maintain good relations with the moderate socialist parties, especially the SP. They gain most of their influence from the labour movements in the urban cities."
 ZLF_events.34.a: "The Centre Faction"
 ZLF_events.34.b: "The Autonomists"
 ZLF_events.34.c: "The Conciliators"

 ZLF_events.35.t: "The First Pan-Tewarean Election!"
 ZLF_events.35.desc: "WIP"
 ZLF_events.35.a: "The Socialist Party sweeps across the continent!"
 ZLF_events.35.b: "Teware rallies behind the IHP, for peace and prosperity!"
 ZLF_events.35.c: "The Civic Union reaches the proletariat!"

 ZLF_events.36.t: "Anti-Reactionary Officers disband Parliament"
 ZLF_events.36.desc: "Following the announcement that the Rightist IHP had won the elections, the army moved swiftly. With support from the paramilitaries, generals from the revolutionary army disbanded parliament and declared a state of emergency."
 ZLF_events.36.a: "Nieder mit der Reaktion!"
 ZLF_military_coup_happened: "A Military Coup has occured"

 ZLF_events.37.t: "The Potential of Magic"
 ZLF_events.37.desc: "WIP"
 ZLF_events.37.a: "Wait, doesn't that contradict Dialectical Materialism?"
 ZLF_events.37.b: "What about communing with the dead?"

 ZLF_events.38.t: "The Trials"
 ZLF_events.38.desc: "WIP"
 ZLF_events.38.a: "..."

 ZLF_events.39.t: "Participatory Governance"
 ZLF_events.39.desc: "WIP"
 ZLF_events.39.a: "..."

 ZLF_events.40.t: "The Spirit of Marxism"
 ZLF_events.40.desc: "WIP"
 ZLF_events.40.a: "Lang lebe die Revolution!"

 ZLF_events.42.t: "In the End"
 ZLF_events.42.desc: "Looking through the window of his small cottage, Ludovik had a beautiful view over Domowina National Park. Despite the hardship they had encountered, the revolutionaries pulled through. The unification of Teware had not been the end goal for them when they started fighting against the monarchist regime, but he could not imagine it ending any other way. Ludovik had distanced himself from politics, letting his fellow party members take more and more responsibility and now, he had also quit his position of commander of the Banner-Army.\n \nThe sunset looked wonderful this evening, he thought."
 ZLF_events.42.a: "The world is a better place now."
 ZLF_events.42.tt: "§CThanks for playing the Edelweiss Liberation Front! Hope you enjoyed the content and the Jam!§!\n  -§YOrlando§!"


 ZLF_news_events.1.t: "Revolutionaries win the Gardenian Civil War"
 ZLF_news_events.1.desc: "The Gardenian Civil War has come to an end, with the revolutionaries of the Edelweiss Banner-Army managing to successfully overthrow the Zinnian Monarchy.\n \nThe new republic has already begun to establish itself in the region, preparing to send unutilised military equipment to democratic forces in the north and making moves to align the Free City of Hortensia. But before Gardenia re-enters the geopolitical stage, they will first have to look inward and recover from the devastation of the civil war."
 ZLF_news_events.1.a: "Nieder mit den Hunden und der Reaktion!"
 ZLF_news_events.1.b: "At last the bloodshed is over."

 ZLF_news_events.2.t: "[ZLF.GetNameDefCap] proclaims May Day"
 ZLF_news_events.2.desc: "To strengthen international solidarity among workers, the [ZLF.GetAdjective] Ministry of Labour has proclaimed the International Workers' Day, or May Day, on this very day, the [?global.date.GetDateStringNoHourLong].\n \nMay has always been connected to the international struggle due to it being the birth month of Karl Marx and in remembrance of the failed May Uprising in Gartenstadt.\n \nThe International Workers' Day is as much a celebration of the successes the Edelweiss Revolution has brought as it is a date to take to the streets and protest their conditions."
 ZLF_news_events.2.a: "Arise, ye workers from your slumbers!"
 ZLF_news_events.2.b: "Let them protest, it is their good right."
 ZLF_news_events.2.c: "Crackdown on any seditious activities."

 ZLF_news_events.3.t: "The Pan-Tewarean Express"
 ZLF_news_events.3.desc: "[ZLF.GetNameDefCap] has revealed plans to connect the entire Tewarean continent with a single railway network.\n \nThis effort is primarily financed by the [ZLF.GetAdjective] Ministry of Infrastructure and Energy, which has been a point of scepsis for prospect participant nations, as it gives an impression of Gardenian economic influence rather than an international project.\n \n[ZLF.GetAdjective] Minister of Foreign Affairs Ekkard Krippendorff has commented on this view, critising the Infrastructure Ministry for not cooperating with his ministry on the project."
 ZLF_news_events.3.a: "Around the World in Seven Days."
 ZLF_news_events.3.b: "Every day, the world grows smaller."

 ZLF_news_events.4.t: "Pan-Tewarean Revolutionary Government Formed"
 ZLF_news_events.4.desc: "The Government of the Gardenian Republic has declared the formation of [ZLF.GetNameDef], as the de-facto and de-jure leader of a significant percentage of the continent. The nations liberated by the Republic as the so-called sibling republics have all held referendum on joining the new continental government, with every single one of them getting a majority of votes for unification. Thanks to previous efforts to integrate the bureaucracy and judiciary of allied nations, the transition will be going smoothly.\n \nOther nations react to this new union in shock, feeling threatened by the new superpower."
 ZLF_news_events.4.a: "Today Teware, Tomorrow the World!"
 ZLF_news_events.4.b: "Is this really horizontal self-coordination?"
 ZLF_news_events.4.c: "The birth of a continental power..."


