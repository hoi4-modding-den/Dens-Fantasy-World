ZNY_new_protest_old_habits: "New Protests old Habits"
ZNY_new_protest_old_habits_desc: "Our subjects are once more angry at us, it's fine we will play the same trick we did before and those savages will calm down"
1_ZNY_tooltip: "We will put the PM as Minister of Economy and see the result."
2_ZNY_tooltip: "We will begin a violent crackdown on Opposition"
ZNY_new_anti_protester_strategy: "New Anti-Protester Strategy"
ZNY_new_anti_protester_strategy_desc: "We were foolish to think those protest would calm down, after all we decieved our people more than a thousand times thinking we were invicible however we need to think a new strategy a more violent one..."
ZNY_violent_crackdown_on_opposition: "Violent Crackdown on Opposition"
ZNY_violent_crackdown_on_opposition_desc: "Opposition parties such as the NPPN are surely organizing those fake protests even if we don't have proof. And if they ask for proof we will just crackdown on media outlet and spread our pro-Liberali Agenda"
ZNY_flying_to_avalon: "Taking a flight to Hortensia"
ZNY_flying_to_avalon_desc: "We need to flee from our country, just in case protesters get us. It is weird that we can't calm down those damned protesters"
ZNY_declare_martial_law: "Declare Martial Law"
ZNY_declare_martial_law_desc: "Our new minister of National Defence proposed to declare martial law and seems the next logical step."
ZNY_protest_peaceful_crackdown_failure: "@ZNY§RProtesters§! refuses to calm down"
ZNY_protest_peetrov_leaves_government: "§YMinister of National Defence §!§RGoloborodko§! leaves Government"
ZNY_protest_repression_fails: "@ZNY§RProtest§! repression fails"
ZNY_etyen_karolier_desc_1: "Born on the 23rd of January 1910 to Adolf Karolier, he grew up in a rich and important political 'dynasty' He studied abroad and became the new President after Adolf Karolier, his dad, gave up the electoral race during the 2nd turn. What followed was years of constant crisis, much worst than his dad. He was involved in various scandals including the Hortensia papers where Etyen engaged in protecting criminals and favoring their business, but to this day has yet to be impeached as the parliament is dominated by Liberali and their ally, the RPN. Many wonder when Karolier's rule will finally end as millions now claim national justice..."
# events and ideas
ZNY_unpopular_government: "Unpopular Government"
ZNY_unpopular_government_desc: "Our government is the most unpopular in history. In less than 5 years, 26 Prime Ministers were picked, more and more contest the TDC's rule and Liberali, the average minister lasts 1 month in government before being thrown into scandals. In reaction people organize strikes, refuse to serve their nation and engage in sabotage operations and refuse to pay taxes. The policies of the Liberali on free trade and conservative cultural positions have worsened the popularity of Liberali.\nIf this circus continues our economy may be crippled..."
ZNY_resistance_in_autonomous_regions: "Resistance in Autonomous Regions"
ZNY_resistance_in_autonomous_regions_desc: "Our 'Autonomous Regions' are infested by separatist arguing they will leave Nyfa as long as the corrupt government continues to rule and treat unfairly minorities."
ZNY_revolution_com_surge: "revolution.com surge"
ZNY_revolution_com_surge_desc: "revolution.com caught the political establishment by surprise. Unlike any new party revolution.com managed to utilize popular contestation to boost their ranks. Their policies are deeply popular within our country: more socially progressive rhetoric, anti-elitist, and economically Marxist. And it could threaten the TDC's rule as a whole. The coalition that ruled for over 35 years, or about 8 presidential mandates is now threatened by a dark horse."
ZNY_next_world_power_not_sure: "Next World Power ?"
ZNY_events.1.t: "New Year Chaos"
ZNY_events.1.d: "Millions gathered in streets contesting the rule of the Liberali after a new corruption scandal after millions of nyfy rubles were embezzled in fraud into the pockets of the newly picked Prime Minister. This protest is beating a historical record of people mobilized in the streets, about 3 million were mobilized that day. Their demands are 'simple' remove the PM and punish corrupt members of the party.\nBut this is fairly normal for us, last year was the same. Each time a new scandal emerges and 'a change' needs to be made, we swap around offices, but the members stay, 'that's what we like to call the illusion of free choice.'."
ZNY_events.1.a: "Surely this will be like last year."

ZNY_events.2.t: "Protests grows larger and more violent"
ZNY_events.2.d: "In Jan Zorzerk thousands joined in the protest rendering our governmental changes useless as protesters realized the PM was just changed up in government while remaining there. Protesters began to be more agressive however has yet to be violent but we will watch the situation closely"
ZNY_events.2.a: "We could not play them forever..."

ZNY_events.3.t: "Fondation of revolution.com"
ZNY_events.3.d: "Few days ago, Rafael Rancho created the party revolution.com initially it was seen as unimportant but would later become one of the most powerful political movements in our nation. Partisans of Rancho organized hundreds of anti-Liberali campaigns and advocated for support of revolution.com instead, this populist movement has shaken the political establishment that was once dominated by the TDC, but now it seems it's in trouble. revolution.com is not like any party ideologically, as the vanguard of a 'connected revolutionary marxism' it even launched a youth movement named 'the Web of the Youth' many worries such radicalism might be a threat to our democracy, however we still have a couple of cards to play."
ZNY_events.3.a: "Another blow to Liberali..."

ZNY_events.4.t: "Protesters and Golobordko Sympathizers Storms Parliament"
ZNY_events.4.d: "After the declaration of Martial Law rioters get violently repressed. The rioters answer by throwing rocks at police, which turns into violent fighting. At 22:30 the AFFN is deployed in Jan Zorzerk however they face opposition as in reaction, part of the AFFN disobeys orders and declares their loyalty to Golobordko. At about 00:30 Protesters and the army loyal to Golobordko storm parliament and imprison all Liberali politicians. However after no members of the government was present Golobordko seized power and held an emergency press conference stating 'Today we destroyed that farce of 'democracy' Those cockroaches stole our NATION only to profit. Us patriots, it's not hard to understand, we needed to eliminate them, it's the only option after all but when we got in the parliament we found NO SWINES. That bunch of propagandists left our suffering nation a long time ago and to think I once served for them. WE ARE THE SALVATION WE ARE THE PEOPLE, AND WE WILL DESTROY THOSE TRAITORS TO HELL KAROLIER. GLORY TO NYFA AND ITS PEOPLE!'"
ZNY_events.4.a: "NYFA IS FREE, SALVATION IS HERE"
ZNY_events.5.t: "Repression faced with failure..."
ZNY_events.5.d: "INTERIOR REPORT: Initially it seems the wind came in our favor however when we arrested the bunch of NPPN criminals we were met with anger from the people, the 'free press' were outraged, literal buy outs. Multiple independent outlets were sanctioned by the government after they spread false accusation that our actions are deemed 'IRRATIONAL' even though we are totally legitimate, worst, those nerds with propaganda continued their dellusions fuelling the fire more, seems also there's moles in our governement as most of them are factually true. Anyways the salvages are sabotaging our country by burning cars and attacking our democratic police"
ZNY_events.5.a: "OUR PEOPLE ARE CRAZY MORONS !"