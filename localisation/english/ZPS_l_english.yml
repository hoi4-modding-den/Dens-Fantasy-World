#Decisions
ZPS_ethnic_stability: "Species Stability"
ZPS_ethnic_stability_desc: "Despite appearances, not all is rosy. Although we are in general §Ysupported by all species§! in the nation, some have less than positive opinions §Rtowards each other§!. If we support one species too much, another may get §Rangry§!. This system keeps the harmony, but makes stalling a real issue.\n\n§RWe walk a fine line, make sure you do not break it§!"
