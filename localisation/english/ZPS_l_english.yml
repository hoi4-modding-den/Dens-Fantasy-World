#Character Descs
ZPS_Council_of_Species_desc: "The Council of Species was set up to allow for representation of all the seperate species of the Pan-Specific. Although their are large amounts of some species, others such as Corvids and Stomatopod are minorities and the only way for them to gain representation is through the council. The council is democratic, with representatives elected by each region, but there are sets amount of national minorities required in governance. Despite rising tensions in the world, the council has continued support from the vast majority of the population."

