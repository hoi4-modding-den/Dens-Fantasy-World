#Ideologies
national_primitivism: "National Primitivism"
national_primitivism_desc: "National Primitivism supports retroactive policies which eliminates technology and modern ideas. It seeks to return to old morals inside the nation state. Usually supremacist, it wants to use the state to stamp down national minorities and assert their apparent dominance."
communalism: "Communalism"
communalism_desc: "Communalism is a left-wing ideology that seeks to eventually eliminate the state and replace it with democratic councils. It is extremley socially progressive and anti-class."
pan_species_cosmopolitanism: "Pan-Species Cosmopolitanism"
pan_species_cosmopolitanism_desc: "Pan-Species Cosmopolitanism states that the world should be united under one government, but that the government should be for all, with a representative and democratic form of governance. Though reformist in theory, in practise it will usually use force to integrate nations into its union."

#Bookmark
ZPS_GATHERING_STORM_DESC: "The Pan-Specific is a nation of many species. All work in relative harmony towards a better future, despite their differences. The largest species are the Portia, sentient matriarchal spiders. Followed by Humans, who inhabit much of the centre of the nation. Octopi make up a large portion of the population, their opinions ever changing. Then the smaller groups of Ultraviolent Mantis Shrimp and the Corvids, whose intellect requires two seperate birds to be fully realised. All of this is held together by the cold 'Avrana Kern', the personality of a long dead Human realised in the movements of ants."

