#GUI
ZPS_Portia_Profile_Text: "§YPortia§!- Sentient Spiders who communicate through vibrations of their palps. The females were §Yhistorically dominate§! and this is still previlant in their culture, although the days where males were §Rkilled§! for fun are over. The males are usually more progressive."
ZPS_Portia_Madness_Text: "Anger:\n§R[?ZPS_Portia_Anger]/10§!"
ZPS_Human_Profile_Text: "§YHuman§!- The largest group on the world, in the Pan-Specific they are not a majority. They communicate through the emission of vibrations in the air. They tend to be either §Yprogressive§! or §Rviolently reactionary§!. They are the largest of the species by a considerable margain."
ZPS_Human_Madness_Text: "Anger:\n§R[?ZPS_Human_Anger]/10§!"
ZPS_Octopus_Profile_Text: "§YOctopu§!s- Octopi do not communicate through the usual means but through §Ypatterns on their skin§! which reflect their mood, thoughts and opinions. Consiquently they §Ycannot hide their feelings§! and do not lie. On top of this, the decentralised nature of their brains means they have §Rno strict loyalties§! and constantly shift between different opinions, even ones they vermently supported may quickly become wrong to them."
ZPS_Octopus_Madness_Text: "Anger:\n§R[?ZPS_Octopus_Anger]/10§!"
ZPS_Shrimp_Profile_Text: "§YStomatopod§!- These Shrimp are a small minority in the nation and usually communicate through §Rviolence§!, this makes their interactions with other species §Rdifficult§!, especially as they love their personal space and will attack any who come to close. Despite this they do wish to be in the Pan-Specific. They have considerable §Ranger towards the Octopi§! as the only other aquatic species in the nation."
ZPS_Shrimp_Madness_Text: "Anger:\n§R[?ZPS_Shrimp_Anger]/10§!"
ZPS_Corvid_Profile_Text: "§YCorvid§!- Communicating like humans through the parroting of words and phrases they have heard before the Corvids have §Yno real intellect§! themselves, instead two crows of opposing phenotypes must enter into a union, and then an §Yintellect can be formed in the mind that exists between them§!, thanks to their two opposing skills. One Corvid is very good at remembering but useless at problem solving, the other the opposite, this union forms a strange mind when they both work together. In general they do not consider themselves intellegent which has lead to many heated discussions, especially with instances of Kern."
ZPS_Corvid_Madness_Text: "Anger:\n§R[?ZPS_Corvid_Anger]/10§!"

