 ZPK_penguin_nature:0 "Aptenodytian Adaptations"
 ZPK_penguin_nature_desc:0 "Due to our biological nature, we can tolerate cold climates much better than other species, and have adapted to spending 1/4th of the year in total day or night. Additionally, we are extremely adept at aquatic hunting, and can dive to a depth of over 500 meters. However, our adaptations with the cold come at the cost of making temperatures above 20°C (68°F) simply not tolerable for us. Hopefully we'll never have to venture too close to the equator."
 
