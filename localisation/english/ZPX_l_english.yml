 ###Events###
 ##Kingdom##
 ZPK.NE.1.t:0 "The Aptenodytian Civil War Resumes"
 ZPK.NE.1.d:0 "The distant and cold region of Aptenodytia has been in a state of civil conflict for almost 20 years now, but for the past several years has remained in a ceasefire. Today, the ceasefire has been broken, as ‘‘Holy Army’’ divisions crossed the Iqaluit River into Clockist territory. Not wanting to be left out, the Nihilists too have crossed the border, with reports of penguins in black uniforms having been seen in the border town of Valdivia. It remains to be seen how this will affect the lucrative oil trade from the Nihilist controlled deserts in Northern Aptenodytia (or South for non-Penguin readers)."
 ZPK.NE.1.a:0 "The hell is a ''Clockist''?"
 ZPK.NE.1.b:0 "This ends now."
 ##Island##
 #Debug#
 ZPI.XE_1.t:0 "ERROR - ZPI_high_id = 0"
 ZPI.XE_1.d:0 "If you are reading this, an error has occurred:\n\nQuiz results are invalid. This may happen if every value actually equals 0 (an error in the events), or the values are simply not being counted (an error in the scripted effects).\n\nIf you are reading this and are not a mod developer, please contact Carrera (Carrera075 on Discord) and tell them what actions resulted in this error."
 ZPI.XE_1.a:0 "Please return to main menu and start a new game to resume."
 ZPI.XE_2.t:0 "ERROR - ZPI_high_id = invalid value"
 ZPI.XE_2.d:0 "If you are reading this, an error has occurred:\n\nQuiz results are invalid. This is likely a programming error with the ZPI_quiz_points_check variables in the ZPI_scripted_effects.txt file.\n\nIf you are reading this and are not a mod developer, please contact Carrera (Carrera075 on Discord) and tell them what actions resulted in this error."
 ZPI.XE_2.a:0 "Please return to main menu and start a new game to resume."
 #Natural Events#
 ZPI.NE_1.t:0 "A Brief Introduction"
 ZPI.NE_1.d:0 "§LOh shit oh fuck wait hold on\n\n§!*pant* Uh, hello! You caught us a bit off guard here. We don’t typically get, uh, visitors here. Especially not of your, like, incorporeal nature. You can hear me, right? What do you mean you’re reading my words? Nevermind. It’s not important. Look, things don’t work the same way for you here as they do in other places. You need to, well, exist, for one. Looking top-down on the world isn’t going to cut it. But you can’t really be with us, can you? No, I thought not. Uh, let me see if I can find anything to work with here...\n\nOkay, this is going to sound, uh, strange, but I have here a personality test with me. All I ask is that you be as honest and truthful as possible when you answer me. Understood? Well, you can’t answer that. Okay, let me know when you are ready."
 ZPI.NE_1.a:0 "Ready"
 ZPI.NE_1.a.t:0 "You will recieve events about once an in-game day, until the quiz has finished."
 ZPI.NE_2.t:0 "One last thing..."
 ZPI.NE_2.d:0 "Hi, it’s me again. What? No, everything’s fine, it’s just... Nevermind. I know this technically isn’t part of the script, but I was wondering if you could answer one last question for the quiz, just to uhhhh round out the numbers a bit. What is it? Wait...\n\nuhhh, hold on...\n\nOkay, I know it’s not very creative, but how about this:\n\nAre you a boy or a girl?"
 ZPI.NE_2.a:0 "Boy"
 ZPI.NE_2.a.t:0 "Of course."
 ZPI.NE_2.b:0 "Girl"
 ZPI.NE_2.b.t:0 "Interesting."
 ZPI.NE_2.c:0 "Neither"
 ZPI.NE_2.c.t:0 "I didn't know they had that where you are."
 ZPI.NE_2.e:0 "Fuck you"
 ZPI.NE_2.e.t:0 "Feisty one, ain'tcha."
 ZPI.NE_3.t:0 "FUCK"
 ZPI.NE_3.d:0 "Okay, you got me. I’ll just admit it, the results are completely tied. I don’t know how this happened. Is it a flaw with the test itself or are you just really indecisive? Whatever, I give up. Just choose whatever you want. Here’s a bunch of random bullshit we had lying around, good luck."
 ZPI.NE_3.a:0 "Is this Harry Du Bois from Disco Elysium?"
 ZPI.NE_3.b:0 "Obligatory Club Penguin Reference."
 ZPI.NE_3.c:0 "YES TROTSKY PENGUIN ARMY!"
 ZPI.NE_3.e:0 "Might as well just play vanilla HOI4."
 #Diplomatic Events#
 ZPI.DE_1.t:0 "[ZPI.GetName] Requests our Protection"
 ZPI.DE_1.d:0 "The remote region of [ZPI.GetName] has recently come under control of a friendly government, and as a result, is now seeking our protection as part of our claim to being the rightful government of Aptenodytia. While small and underdeveloped, they could be of use in the civil war."
 ZPI.DE_1.a:0 "Welcome back."
 ZPI.DE_1.b:0 "Maybe not right now..."
 ZPI.DE_2.t:0 "[FROM.GetName] Refuses to Protect Us"
 ZPI.DE_2.d:0 "Despite our best efforts to appeal to the sensibilities of the [FROM.GetName], we have been firmly rejected from their protection. We are once again on our own."
 ZPI.DE_2.a:0 "No wonder this country is like this."
 ZPI.DE_3.t:0 "[FROM.GetName] Agrees to Protect Us"
 ZPI.DE_3.d:0 "The diplomats from the [FROM.GetName] have reached their decision, and have agreed to let us come under their protection. We are now supporting them in their efforts to end the civil war in their favor."
 ZPI.DE_3.a:0 "Good."
 #Autocratic Events#
 ZPI.AUE_1.t:0 "Mayoral Election"
 ZPI.AUE_1.d:0 "You are running for mayor of your municipality, and your polling numbers are doing very poorly. How do you respond?"
 ZPI.AUE_1.a:0 "Continue as normal, slow and steady wins the race."
 ZPI.AUE_1.b:0 "Launch a vicious ad-campaign against your opponent."
 ZPI.AUE_1.c:0 "Just give up. It wasn’t meant to be."
 ZPI.AUE_2.t:0 "The Task"
 ZPI.AUE_2.d:0 "You have been asked to do a difficult task. What will you do?"
 ZPI.AUE_2.a:0 "Do it myself."
 ZPI.AUE_2.b:0 "Ask someone for help."
 ZPI.AUE_2.c:0 "Make someone else do it!"
 ZPI.AUE_3.t:0 "Fancy Restaurant"
 ZPI.AUE_3.d:0 "You are eating at a nice restaurant that you have never been to before. What do you select?"
 ZPI.AUE_3.a:0 "Steak, medium rare."
 ZPI.AUE_3.b:0 "A healthy fish dinner."
 ZPI.AUE_3.c:0 "The daily special, whatever it may be."
 ZPI.AUE_3.e:0 "Chicken tenders and fries."
 ZPI.AUE_4.t:0 "..."
 ZPI.AUE_4.d:0 "Do you often think that, no matter what, life goes on?"
 ZPI.AUE_4.a:0 "All the time!"
 ZPI.AUE_4.b:0 "Never."
 ZPI.AUE_5.t:0 "You seem to be..."
 ZPI.AUE_5.d:0 "The Autocratic Type!\n\nYou are the sort of person that knows exactly what they want. The world is your oyster, and you’re not just going to let other people boss you around, when YOU should be the one in charge! You move without regard for norms and standards, because why should I have to change for everyone else. You set the rules in the house, or at least you wish you could, because you really do know what’s best for everyone. The feelings of other people may be important to you, but you know deep down that you must ‘‘look out for number one’’, for no one else will. The world may be cruel, but that’s just how the world works."
 ZPI.AUE_5.a:0 "I've always been fond of the iron fist..."
 ZPI.AUE_5.b:0 "What! That's not me at all!"
 #I only realized after I made all of these that I could just reuse ZPI.AUE_5.b directly in the events file for all the other events...
 #Theocratic Events#
 ZPI.THE_1.t:0 "Wait..."
 ZPI.THE_1.d:0 "Hey, what’s that? There’s someone behind you!\n\n\n\nSo... did you look just now?"
 ZPI.THE_1.a:0 "Don’t do that! It scared me!"
 ZPI.THE_1.b:0 "I’ll admit it, you got me."
 ZPI.THE_1.c:0 "No way. I didn’t fall for it."
 ZPI.THE_1.e:0 "Huh? What?"
 ZPI.THE_2.t:0 "Problems"
 ZPI.THE_2.d:0 "You have a serious personal problem that is outside of your control. How do you deal with it?"
 ZPI.THE_2.a:0 "Pray for better times."
 ZPI.THE_2.b:0 "Just hope it goes away."
 ZPI.THE_2.c:0 "Outside of my control? There must be something that I can do about it."
 ZPI.THE_2.e:0 "Reach out to friends and/or family."
 ZPI.THE_3.t:0 "Truth"
 ZPI.THE_3.d:0 "Someone tells you a fact, but it contradicts what you know to be true. Should you correct them?"
 ZPI.THE_3.a:0 "Yes! I know I’m right!"
 ZPI.THE_3.b:0 "Agree with them. They might be right."
 ZPI.THE_3.c:0 "Ask them for more information."
 ZPI.THE_3.e:0 "Keep it to yourself."
 ZPI.THE_4.t:0 "On The Edge"
 ZPI.THE_4.d:0 "Someone you are close to has become very depressed, and has expressed to you thoughts of ‘‘not wanting to exist’’. How do you respond to them?"
 ZPI.THE_4.a:0 "It would be a sin."
 ZPI.THE_4.b:0 "There's so much to live for!"
 ZPI.THE_4.c:0 "We need you, we would miss you."
 ZPI.THE_4.e:0 "The decision is your own. Just know that I'm here for you."
 ZPI.THE_5.t:0 "You seem to be..."
 ZPI.THE_5.d:0 "The Theocratic Type!\n\nYou are the sort of person that believes that everything happens for a reason. Even if things get you down, it doesn’t matter, because it’s all part of a greater plan. When someone tells you to do something, it doesn’t matter if the reason is good, or logical, or even beneficial; You listen to those above you because you are supposed to. Because you understand that the most important things in life are structure and hierarchy. After all, what kind of a world would we live in if people just did things without morality? It wouldn’t be the sort of world that you would want to live in, that’s for sure."
 ZPI.THE_5.a:0 "Maybe I should go to church more..."
 ZPI.THE_5.b:0 "What! That's not me at all!"
 #Clockist Events#
 ZPI.CLE_1.t:0 "Work Ethic"
 ZPI.CLE_1.d:0 "What would you say your work style is?"
 ZPI.CLE_1.a:0 "Working hard, every day."
 ZPI.CLE_1.b:0 "I Just do what is needed of me."
 ZPI.CLE_1.c:0 "I can’t do it alone."
 ZPI.CLE_1.e:0 "Working? What work?"
 ZPI.CLE_2.t:0 "Resolutions"
 ZPI.CLE_2.d:0 "Have you followed through on your New Year’s resolutions?"
 ZPI.CLE_2.a:0 "Of course!"
 ZPI.CLE_2.b:0 "No."
 ZPI.CLE_2.c:0 "What are those?"
 ZPI.CLE_3.t:0 "Error!"
 ZPI.CLE_3.d:0 "You find an exploit in the game that you are playing. What do you do about it?"
 ZPI.CLE_3.a:0 "Report it to the developers."
 ZPI.CLE_3.b:0 "Use it to my advantage."
 ZPI.CLE_3.c:0 "Just ignore it and move on."
 ZPI.CLE_4.t:0 "Fashionably Late"
 ZPI.CLE_4.d:0 "Do you think it's important to be fashionably late?"
 ZPI.CLE_4.a:0 "Yes."
 ZPI.CLE_4.b:0 "No."
 ZPI.CLE_4.c:0 "I don't know."
 ZPI.CLE_5.t:0 "You seem to be..."
 ZPI.CLE_5.d:0 "The Clockist Type!\n\nYou are a very serious kind of person. For you, efficiency is the key to living a good life. Hard work makes the dream work as they say, and nobody works harder than you. You tend to adopt new technologies the moment they come out, so you can integrate them into your workflow. Imagine how much work you can get done when a machine does it for you! Even while playing this, you probably have a video open in your second monitor, and your phone out in front of your keyboard. If only other people were as efficient as you are, then maybe we would actually get somewhere."
 ZPI.CLE_5.a:0 "I should get a second job..."
 ZPI.CLE_5.b:0 "What! That's not me at all!"
 #Social Democratic Events#
 ZPI.SDE_1.t:0 "Free Time"
 ZPI.SDE_1.d:0 "Do you prefer to be busy or to have a lot of free time?"
 ZPI.SDE_1.a:0 "Being busy."
 ZPI.SDE_1.b:0 "Free time!"
 ZPI.SDE_1.c:0 "In-between."
 ZPI.SDE_2.t:0 "Sudden Sale"
 ZPI.SDE_2.d:0 "You notice that a game you bought for full price yesterday is marked down to half price today! How do you feel?"
 ZPI.SDE_2.a:0 "Heartbroken."
 ZPI.SDE_2.b:0 "Furious!"
 ZPI.SDE_2.c:0 "Bad timing, I guess..."
 ZPI.SDE_2.e:0 "Good for them!"
 ZPI.SDE_3.t:0 "Budget Deficit"
 ZPI.SDE_3.d:0 "You are balancing your budget, when you notice that you are coming up a bit short. How do you make up for the deficit?"
 ZPI.SDE_3.a:0 "Put it on credit."
 ZPI.SDE_3.b:0 "Reduce spending."
 ZPI.SDE_3.c:0 "Find a place with cheaper rent."
 ZPI.SDE_3.e:0 "Ask friends for money."
 ZPI.SDE_3.f:0 "Just ignore it. It’ll go away."
 ZPI.SDE_4.t:0 "Better or Worse"
 ZPI.SDE_4.d:0 "Do you agree with the statement ‘‘Things could be a lot worse’’?"
 ZPI.SDE_4.a:0 "Yes! We are in a good place."
 ZPI.SDE_4.b:0 "No! Things could be a lot better too!"
 ZPI.SDE_4.c:0 "Yes, and that’s where we are heading."
 ZPI.SDE_4.e:0 "No, this is as bad as it gets."
 ZPI.SDE_5.t:0 "You seem to be..."
 ZPI.SDE_5.d:0 "The Social-Democratic Type!\n\nYou are very empathetic! You understand that the world does not have to be so hard if everyone just helped each other out. If people just helped you out from time to time... Not that the world is really that bad in the grand scheme of things. After all, can things really be that bad when everyone can afford to have a computer in their pocket? No, the people who want to throw out everything would just set us back. All we need to do is to just ‘‘sand off’’ the rough parts of society, and everything will work out in the end."
 ZPI.SDE_5.a:0 "I've always been fond of the velvet glove..."
 ZPI.SDE_5.b:0 "What! That's not me at all!"
 #Guideist Events#
 ZPI.GUE_1.t:0 "The Blame Game"
 ZPI.GUE_1.d:0 "Do you think blaming something you did on someone else is sometimes necessary?"
 ZPI.GUE_1.a:0 "Of course!"
 ZPI.GUE_1.b:0 "Never!"
 ZPI.GUE_1.c:0 "I don't know?"
 ZPI.GUE_2.t:0 "Large and..."
 ZPI.GUE_2.d:0 "If you were in charge, how would you run things?"
 ZPI.GUE_2.a:0 "Firm and commanding."
 ZPI.GUE_2.b:0 "Nonrestrictive but fair."
 ZPI.GUE_2.c:0 "Violently."
 ZPI.GUE_2.e:0 "I wouldn’t."
 ZPI.GUE_3.t:0 "A Quick Survey"
 ZPI.GUE_3.d:0 "While out walking, a low-level government official goes up to you with a clipboard and asks if you want to fill out a brief survey. Do you answer?"
 ZPI.GUE_3.a:0 "Of course."
 ZPI.GUE_3.b:0 "No way!"
 ZPI.GUE_3.c:0 "Give them false answers on purpose."
 ZPI.GUE_4.t:0 "Karaoke"
 ZPI.GUE_4.d:0 "Do you like karaoke?"
 ZPI.GUE_4.a:0 "Of course! People need to hear my vast, oceanic soul."
 ZPI.GUE_4.b:0 "I do if I have someone else with me."
 ZPI.GUE_4.c:0 "Singing in public! No way!"
 ZPI.GUE_4.e:0 "Music is a distraction from what matters in life."
 ZPI.GUE_5.t:0 "You seem to be..."
 ZPI.GUE_5.d:0 "The Guideist Type!\n\n You are the analytical type. Everything you do is rooted in logic and reason. You’re never afraid to ask for more information, because knowledge is power! The world would be a better place if people knew as much as you do. The problem is that they don’t. But of course, when has that ever stopped you? You love to talk to people about the news and trivia. People *need* to know if they’re right or wrong, how could anyone *want* to be wrong? No, people just need to think things through, and then they will understand you."
 ZPI.GUE_5.a:0 "If only people read as much as I do..."
 ZPI.GUE_5.b:0 "What! That's not me at all!"
 #Totalist Events#
 ZPI.TOE_1.t:0 "Admonishment"
 ZPI.TOE_1.d:0 "If you saw someone doing something bad, could you scold them?"
 ZPI.TOE_1.a:0 "Of course!"
 ZPI.TOE_1.b:0 "Not really."
 ZPI.TOE_2.t:0 "Book Club"
 ZPI.TOE_2.d:0 "You have been invited to a book club, but you don’t really like this month’s book. How do you deal with it?"
 ZPI.TOE_2.a:0 "Just push through and read it."
 ZPI.TOE_2.b:0 "Ignore the book club until they’ve finished reading it."
 ZPI.TOE_2.c:0 "Show up to meetings and pretend to have read it."
 ZPI.TOE_2.e:0 "Show up and talk about a book that you care about instead."
 ZPI.TOE_3.t:0 "Chores"
 ZPI.TOE_3.d:0 "Your parents demand that you do something that you think is unreasonable, how do you respond?"
 ZPI.TOE_3.a:0 "Accept their demands, they know best."
 ZPI.TOE_3.b:0 "Demand an explanation, try to talk them out of it."
 ZPI.TOE_3.c:0 "Just don’t do it."
 ZPI.TOE_3.e:0 "Offer a substitute task for you to do instead."
 ZPI.TOE_4.t:0 "Fashion"
 ZPI.TOE_4.d:0 "How would friends describe your fashion style?"
 ZPI.TOE_4.a:0 "I look good and I know it!"
 ZPI.TOE_4.b:0 "Simple and inoffensive."
 ZPI.TOE_4.c:0 "Wild, if not intentionally outrageous."
 ZPI.TOE_4.e:0 "Friends?"
 ZPI.TOE_5.t:0 "You seem to be..."
 ZPI.TOE_5.d:0 "The Totalist Type!\n\n You do not like taking orders. You have a rebellious streak, and tend to think in provocative statements. It doesn’t matter what people want you to do, you know deep down what is right for *you*, and you’re not going to let anyone tell you what to do! You do everything yourself, and think that the world would be better off if everyone truly thought (and fought) for themselves. Of course, it would be wrong to just ignore the big picture. After all... you can’t make a society without individuals. If everyone thought like you, and just did what is needed of them, maybe the world would be a better place."
 ZPI.TOE_5.a:0 "Maybe I should join a commune..."
 ZPI.TOE_5.b:0 "What! That's not me at all!"
 #Nostalgist Events#
 ZPI.NOE_1.t:0 "Ouch!"
 ZPI.NOE_1.d:0 "Your friend takes a spectacular fall! What do you do?"
 ZPI.NOE_1.a:0 "Help my friend up!"
 ZPI.NOE_1.b:0 "Laugh! It's too funny!"
 ZPI.NOE_2.t:0 "Dreams"
 ZPI.NOE_2.d:0 "Have you ever thought that if you dug in your backyard you could find buried treasure?"
 ZPI.NOE_2.a:0 "Yes."
 ZPI.NOE_2.b:0 "No."
 ZPI.NOE_3.t:0 "Nostalgia"
 ZPI.NOE_3.d:0 "Have you ever found yourself reminiscing about even the mundane parts of your childhood, like travel and advertising?"
 ZPI.NOE_3.a:0 "Yes."
 ZPI.NOE_3.b:0 "No."
 ZPI.NOE_3.c:0 "Maybe?"
 ZPI.NOE_3.e:0 "I wish I was a child again."
 ZPI.NOE_4.t:0 "This Feeling..."
 ZPI.NOE_4.d:0 "Why do you feel bad?"
 ZPI.NOE_4.a:0 "What are you talking about?"
 ZPI.NOE_4.b:0 "It’s my fault, isn’t it."
 ZPI.NOE_4.c:0 "The future is hopeless..."
 ZPI.NOE_4.e:0 "It’s not me! Everybody else is getting worse!"
 ZPI.NOE_5.t:0 "You seem to be..."
 ZPI.NOE_5.d:0 "The Nostalgist Type!\n\n Your fondest memories were of your youth. You are always thinking back to when life was simpler, and everything was good in the world. You spend most of your free time playing games from over 20 years ago, and complaining about everything that is new. Actually... Why have things gotten worse over time? Economic incentives? Financial inequality? Yeah right! It's society itself that has declined, and the people *really* in charge are the ones making it worse! If you were in charge, you would put a stop to the decline, and bring things back to the way they used to be, to the way they were always meant to be..."
 ZPI.NOE_5.a:0 "If only I could return..."
 ZPI.NOE_5.b:0 "What! That's not me at all!"
 #Theocratic Nostalgist Events#
 ZPI.TNE_1.t:0 "Think Before You Speak"
 ZPI.TNE_1.d:0 "Have you ever blurted something out without thinking about the consequences first?"
 ZPI.TNE_1.a:0 "Yes."
 ZPI.TNE_1.b:0 "No."
 ZPI.TNE_2.t:0 "I Wish..."
 ZPI.TNE_2.d:0 "Do you want to be taller someday?"
 ZPI.TNE_2.a:0 "Totally!"
 ZPI.TNE_2.b:0 "Of course not."
 ZPI.TNE_3.t:0 "Childhood"
 ZPI.TNE_3.d:0 "When were your fondest memories as a child?"
 ZPI.TNE_3.a:0 "Playing at home."
 ZPI.TNE_3.b:0 "Being at school."
 ZPI.TNE_3.c:0 "Going to church."
 ZPI.TNE_3.e:0 "Visiting a friend’s house."
 ZPI.TNE_3.f:0 "..."
 ZPI.TNE_4.t:0 "Out and About"
 ZPI.TNE_4.d:0 "When out walking, do you ever interact with strangers?"
 ZPI.TNE_4.a:0 "Yes, it's fun."
 ZPI.TNE_4.b:0 "Yes, so I hear what’s going on in the world."
 ZPI.TNE_4.c:0 "No, I have places to be."
 ZPI.TNE_4.e:0 "No, I’m too nervous."
 ZPI.TNE_4.f:0 "Ew, no."
 ZPI.TNE_5.t:0 "You seem to be..."
 ZPI.TNE_5.d:0 "The Theocratic Nostalgist Type!\n\n You were the kid that always went to church on Sundays when other kids might have done something else. Deep down, you feel that you are the only one who knows what is right in the world. Things have changed far too much for you. The world is moving on, from religion, from you. The things you see on TV, on the internet, in billboards and magazines, they’re just obscene. How could we have allowed this to happen? We have to go back to the good old days, where the fear of god lived in the minds of every individual, and everyone believed. And stay there. Forever."
 ZPI.TNE_5.a:0 "I've always longed to join a crusade..."
 ZPI.TNE_5.b:0 "What! That's not me at all!"
 #misc.#
 ZPI_annoyed_tooltip:0 "§RToo bad!§!"
 ZPI_GATHERING_STORM_DESC:0 "The island province of Qikiqtaaluk has always been a remote and distant part of the Empire, but the outbreak of the Aptenodytian Civil War nearly 20 years ago has left it completely lost and adrift. While the island’s isolation has mostly left it undamaged by the war, it has also made it the typical exile location of various radical extremists throughout the Empire. Expelled from one faction or another, they gather here to bide their time and, rather soon, make their move..."
 VALDES_STRAIT:0 "Strait of Valdes"
 DEMERSUS_STRAIT:0 "Strait of Demersus"