 ###Ideologies###
 penguin_theocracy:0 "Aptenodytist Theocratism"
 penguin_theocracy_desc:0 "The Aptenodytist faith, officially known as ‘‘Worship of the God of the Sea’’, is the primary faith of the Aptenodytians. Believers of the faith believe in several gods, but all of the gods are subservient to the True God, who controls the oceans and provides food in exchange for the heat of the world. Aptenodytist Theocrats believe in a society run by the Church and organized along religious values, with the primary goal of maintaining permanent stability of the status quo; a world frozen in ice, stable and pure."
 clockism:0 "Clockism"
 clockism_desc:0 "Officially referred to as the ‘‘Movement for the Establishment of Time’’, the Clockist movement has sought to transform a society that spends 1/4th of the year in polar twilight and 1/4th of the year in midnight sun, and transform it into a modern, enlightened, and capitalist society, that can compete with the rest of the world. The implementation of capitalism in Aptenodytia has been poorly received by the majority of citizens, as standards of living continue to decline while landowners and industrialists only gain more and more power within society. While many have started to see the clock itself as an instrument of oppression, time will tell if a truly democratic society can be built in the future."
 nostalgism:0 "Nostalgism"
 nostalgism_desc:0 "Nostalgism is less a coherent ideology, and more a vague hodge-podge of reactionary desires, best described by the nostalgist concept of ‘‘Retvrn’’. Nostalgists want nothing more than to return to an imagined past, where everything was good and pure and you can be a kid again, and will stop at nothing to return to this nonexistent childish past. They will kill and kill and kill, whatever it takes, until they can get back the feeling of their childhood. That feeling will never come back..."
 theocratic_nostalgism:0 "Theocratic Nostalgism"
 theocratic_nostalgism_desc:0 "The syncretization of Nostalgist concepts with the Aptenodytist faith, Theocratic Nostalgism seeks to ‘‘Retvrn’’ society to a time before capitalism and democracy, when religion held total control over all of society and everything was ‘‘pure’’. Some of the most radical Theocratic Nostalgists believe that the world must be ‘‘purified’’ in order to restore the world to its proper order, though what exactly purification means is up to interpretation."
 nihilism:0 "Nihilism"
 nihilism_desc:0 "Nihilism is a political ideology which advocates that religion, capitalism, and social institutions are entirely worthless if not outright meaningless, and advocates for the destruction of oppressive and hierarchical societies. Nihilism contains a wide range of thought, though an emphasis has been placed in recent years for the working class and the destruction of capitalist society."
 guideist_nihilism:0 "Guideist Nihilism" #not entirely sure how that should be spelled
 guideist_nihilism_desc:0 "Guideism is an ideology based on nihilist thought, primarily diverging from mainline nihilism in its belief in the necessity of a vanguard party to ‘‘de-program’’ society from capitalist propaganda, and to properly implement an anti-religious and anti-capitalist society. While Guideist are still aligned with the main nihilist movement, they may split off from it if they gain sufficient power."
 totalist_nihilism:0 "Totalist Nihilism"
 totalist_nihilism_desc:0 "Totalism is an ideology proclaiming itself to be the logical conclusion of nihilist thought. Totalists call for the ‘‘total abolition’’ of authority, hierarchy, and the state itself, among many other things, and the reorganization of the world into a stateless society based around voluntary association. Totalists themselves are divided into individualists, who reject politics itself and advocate for the individual, and organizationalists, who advocate for voluntary political organizations to foment revolution against capital."

