 ###Events###
 #Island#
 ZPI.NE_1.t:0 "A Brief Introduction"
 ZPI.NE_1.d:0 "§LOh shit oh fuck wait hold on\n\n§!*pant* Uh, hello! You caught us a bit off guard here. We don’t typically get, uh, visitors here. Especially not of your, like, incorporeal nature. You can hear me, right? What do you mean you’re reading my words? Nevermind. It’s not important. Look, things don’t work the same way for you here as they do in other places. You need to, well, exist, for one. Looking top-down on the world isn’t going to cut it. But you can’t really be with us, can you? No, I thought not. Uh, let me see if I can find anything to work with here...\n\nOkay, this is going to sound, uh, strange, but I have here a personality test with me. All I ask is that you be as honest and truthful as possible when you answer me. Understood? Well, you can’t answer that. Okay, let me know when you are ready."
 ZPI.NE_1.a:0 "Ready"
 
