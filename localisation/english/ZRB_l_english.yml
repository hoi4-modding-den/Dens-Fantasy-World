 # CHARACTERS #
 ZIA_tanam_petuja_name: "Tánam Petůja"
 ZIA_tanam_petuja_desc: "Born in 1880 Tánam Petůja began his political campaign at the start of the new millenium, quickly rising to promincnce due to his passionate speeches for liberation and a new social model to give everyone equal rights. He got voted in in 1930, though not without controversies. He has been seen making deals with nobles and purists behind the peoples back, despite all of this he continues to try and make social reforms. Claiming the deals to make compromises for the sake of liberty."

