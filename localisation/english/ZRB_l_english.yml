 # IDEOLOGIES #
 ciavenism: "Çíavenism"
 ciavenism_desc: "Çíavenism is a type of constitutional monarchy originating from the mountainous regions around Transurhú, after tribal expansion away from these lands the system was eventually adopted in Tůrůń. It consists of an elected council for the figurehead monarch, but also a prime minister elected via tradition and votes."

