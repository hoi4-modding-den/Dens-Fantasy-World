# EVENTS

 ZSP_start_events.1.t: "Knightfall"
 ZSP_start_events.1.desc: "I had send out the knightly order under the pretense of them needing to fight a strong ogre in the forest north of Michelshof. Naturally, those fools all but believed me and went out."
 ZSP_start_events.1.a: "They never returned."

 ZSP_start_events.2.t: "A Realm of Possibilities"
 ZSP_start_events.2.desc: "The realm of shadows is most potent. My magical abilities have increased tenfold ever since I first took a glimse of it. I studied it, I became it."
 ZSP_start_events.2.a: "It won't be for naught."

 ZSP_start_events.3.t: "War against the Towers"
 ZSP_start_events.3.desc: "My proclamation was a simple one, of power and dominance. The towers would submit to me or perish. Naturally, this didn't come well to those foolish fools."
 ZSP_start_events.3.a: "Zur Hölle mit dem Turmfrieden!"

 ZSP_start_events.4.t: "Fall of the Stars"
 ZSP_start_events.4.desc: "I strode right through the front door of the Sternwarte, its massive wooden doors doing nothing to stop me. The apprentices came for me first. Apparently they thought me a pushover. As the last Sternenwart fell, I entered the observatorium, taking in the breathtaking sight of the stars above me."
 ZSP_start_events.4.a: "Even the skies will bend to my will."

 ZSP_start_events.5.t: "In the Mist"
 ZSP_start_events.5.desc: "The Nebelturm always seemed so incredibly foolish. With their power to create illusions, did they use it to trick their enemies? To torture them and crush them in an endless tunnel of delusions? No, they made 'art'. The fire in the gallery was unnecessary, but it sure felt good."
 ZSP_start_events.5.a: "What good is magic if you restrict yourself like this?"

 ZSP_start_events.6.t: "Fire in Sachsenhagen"
 ZSP_start_events.6.desc: "The Eisenturm was the most pretentious of the five. All they did was follow along the progress of the outside world, but they acted as if they were the only ones who could do it. It was a pleasure seeing their tower in flames."
 ZSP_start_events.6.a: "Arrogance leads to fall."

 ZSP_start_events.7.t: "My Name is Ozymandias, King of Kings"
 ZSP_start_events.7.desc: "As I took my rightful place on the Purple Throne in the Great Temple of the Golden Compass, all I could think of was my next step. How could I enjoy my victory when I was still surrounded by my enemies?"
 ZSP_start_events.7.a: "Look on my works, ye Mighty, and despair!"

 ZSP_phoenix_events.1.t: "The Phoenix"
 ZSP_phoenix_events.1.desc: "During my extermination of the Sternwarte, I missed one of the disciples. I was informed of this by one of the townsfolk who were in the experimentation hall. Apparently, this disciple has taken up the moniker 'Phoenix' as a sign that he rose from the ashes of the fire I started."
 ZSP_phoenix_events.1.a: "Ashes to ashes, you will fail."

 ZSP_phoenix_events.2.t: "The Spirits that I summoned"
 ZSP_phoenix_events.2.desc: "I have made a grave mistake. And now, I can no longer unmake it. The creatures of shadows that called out to me. I sought to use their powers to strengthen mine own. But I was betrayed. I am merely their puppet."
 ZSP_phoenix_events.2.a: "I now cannot rid myself of again."

 ZSP_phoenix_events.3.t: "Bit of a Monster"
 ZSP_phoenix_events.3.desc: "The darkness has taken hold of me. I know I should not fight it, yet my feelings tell me otherwise. 'Perhaps it's not too late to change?' What foolish thoughts."
 ZSP_phoenix_events.3.a: "Holding my head up high to keep on breathing."

 ZSP_phoenix_events.4.t: "Determination"
 ZSP_phoenix_events.4.desc: "Why am I heading for the top? To crush all those who thought they could beat me, who thought they could live freely. It matters not if I am a Monster. I shall bring ruin."
 ZSP_phoenix_events.4.a: "Shadows dancing as I raise my fist into the air."

 ZSP_phoenix_events.5.t: "Futility"
 ZSP_phoenix_events.5.desc: "My reign is being challenged. The Phoenix has begun to openly challenge me, seizing control over various important military strongholds across the nation. He has even undermined my control over the thralls. He must be stopped."
 ZSP_phoenix_events.5.a: "And yet... Is this my chance for Salvation?"
 ZSP_phoenix_events.5.tt: "Thus ends the story of §YOzymandias§!. A life lived in futile struggle life itself.\n \nThe §YShadow Realm§! will collapse into §RAnarchy§!."
 ZSP_phoenix_events.5.b: "No! I Will Endure!"

 ZSP_phoenix_events.6.t: "What Remains"
 ZSP_phoenix_events.6.desc: "Gardenia and Celandra lie in ruins. Nothing left but dust and rubble. The few survivors, be they former slaves or thralls, have rallied under the aegis of the Phoenix."
 ZSP_phoenix_events.6.a: "We must make the best of it."

 ZSP_phoenix_events.7.t: "The Ozymandian Proclamation"
 ZSP_phoenix_events.7.desc: "WIP"
 ZSP_phoenix_events.7.a: "We will push back the Shadow Menace!"


 ZSP_news_events.1.t: "Shadow Incursion into Gardenia"
 ZSP_news_events.1.desc: "The Alstroemerian Magocracy - now named the Realm of Shadows - under leadership of the Sorcerer Ozymandias has launched an invasion of Gardenia with the supposed goal of 'restoring' rightful control over the region."
 ZSP_news_events.1.desc_no_cw: "Fragile peace in Gardenia has been interrupted with the beginning of an incursion from the Alstroemerian region.\n \n$ZSP_news_events.1.desc$"
 ZSP_news_events.1.desc_cw: "The Gardenian Civil War has been disrupted with the beginning of an incursion from the Alstroemerian region.\n \n$ZSP_news_events.1.desc$"
 ZSP_news_events.1.a: "Fall before the Might of Ozymandias!"
 ZSP_news_events.1.b: "Get into defensive positions!"
 ZSP_news_events.1.c: "Great. Another power-hungry lunatic."

 ZSP_news_events.2.t: "Shadow Incursion into Celandra"
 ZSP_news_events.2.desc: "With Gardenia fully secured under his reign, Ozymandias has now begun his invasion of Celandra. Many nations are now preparing to send volunteers as losing control over the Alba strait may hurt international trade and another victory for Ozymandias will only strengthen him more."
 ZSP_news_events.2.a: "The foolish Crown shall break!"
 ZSP_news_events.2.b: "We must weather the Storm!"
 ZSP_news_events.2.c: "This is getting dangerous."

 ZSP_news_events.3.t: "Ozymandian Proclamation"
 ZSP_news_events.3.desc: "WIP"
 ZSP_news_events.3.a: "All shall bow to me!"

 ZSP_news_events.4.t: "Collapse of the Shadow Realm"
 ZSP_news_events.4.desc: "I met a traveller from an antique land who said: — Two vast and trunkless legs of stone stand in the desert... Near them, on the sand, half sunk, a shattered visage lies. Whose frown, and wrinkled lip, and sneer of cold command, tell that its sculptor well those passions read which yet survive, stamped on these lifeless things, the hand that mocked them, and the heart that fed.\n \nAnd on the pedestal these words appear 'My name is Ozymandias, King of Kings. Look on my works, ye Mighty, and despair!'\nNothing beside remains. Round the decay of that colossal wreck, boundless and bare the lone and level sands stretch far away."
 ZSP_news_events.4.a: "And thus, the Ozymandian Reign ends."

 ZSP_news_events.5.t: "The Great Shadow War"
 ZSP_news_events.5.desc: "Following the proclamation made a few months ago, Ozymandias, the Mage-Lord turned Avatar of Shadows, has begun his invasion of neighbouring nations, with reports of his marching legions already spreading across the world."
 ZSP_news_events.5.a: "Everything Will Return To Nothing!"
 ZSP_news_events.5.b: "Brace for Impact."


