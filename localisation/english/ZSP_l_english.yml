# IDEOLOGIES

 tyrannical_magocracy: "Tyrannical Magocracy"
 tyrannical_magocracy_desc: "Magocracy is the rule of spellcasters where magical talent is the most valued asset. A peasant with magical skill can quickly rise to the upper class, while those of lesser talent are consigned to serve their superiors. In its tyrannical form, the nation's people are considered of secondary importance to the advancement of magical research and furthering the goals of the sorcerer class."


# CHARACTERS

 ZSP_wizard_council_name: "Highest Council"
 ZSP_ozymandias_name: "Ozymandias"
 ZSP_ozymandias_desc: "Ein Wandrer kam aus einem alten Land,\nUnd sprach: „Ein riesig Trümmerbild von Stein\nSteht in der Wüste, rumpflos Bein an Bein,\nDas Haupt daneben, halb verdeckt vom Sand.\n \nDer Züge Trotz belehrt uns: wohl verstand\nDer Bildner, jenes eitlen Hohnes Schein\nZu lesen, der in todten Stoff hinein\nGeprägt den Stempel seiner ehrnen Hand.\n \nUnd auf dem Sockel steht die Schrift: ‚Mein Name\nIst Ozymandias, aller Kön'ge König:\nSeht meine Werke, Mächt'ge, und erbebt!‘\n \nNichts weiter blieb. Ein Bild von düstrem Grame,\nDehnt um die Trümmer endlos, kahl, eintönig\nDie Wüste sich, die den Koloß begräbt.“"


