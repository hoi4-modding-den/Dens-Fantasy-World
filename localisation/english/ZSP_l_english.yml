# EVENTS

 ZSP_start_events.1.t: "Knightfall"
 ZSP_start_events.1.desc: "I had send out the knightly order under the pretense of them needing to fight a strong ogre in the forest north of Michelshof. Naturally, those fools all but believed me and went out."
 ZSP_start_events.1.a: "They never returned."

 ZSP_start_events.2.t: "A Realm of Possibilities"
 ZSP_start_events.2.desc: "The realm of shadows is most potent. My magical abilities have increased tenfold ever since I first took a glimse of it. I studied it, I became it."
 ZSP_start_events.2.a: "It won't be for naught."

 ZSP_start_events.3.t: "War against the Towers"
 ZSP_start_events.3.desc: "My proclamation was a simple one, of power and dominance. The towers would submit to me or perish. Naturally, this didn't come well to those foolish fools."
 ZSP_start_events.3.a: "Zur Hölle mit dem Turmfrieden!"

 ZSP_start_events.4.t: "Fall of the Stars"
 ZSP_start_events.4.desc: "I strode right through the front door of the Sternwarte, its massive wooden doors doing nothing to stop me. The apprentices came for me first. Apparently they thought me a pushover. As the last Sternenwart fell, I entered the observatorium, taking in the breathtaking sight of the stars above me."
 ZSP_start_events.4.a: "Even the skies will bend to my will."

 ZSP_start_events.5.t: "In the Mist"
 ZSP_start_events.5.desc: "The Nebelturm always seemed so incredibly foolish. With their power to create illusions, did they use it to trick their enemies? To torture them and crush them in an endless tunnel of delusions? No, they made 'art'. The fire in the gallery was unnecessary, but it sure felt good."
 ZSP_start_events.5.a: "What good is magic if you restrict yourself like this?"

 ZSP_start_events.6.t: "Fire in Sachsenhagen"
 ZSP_start_events.6.desc: "The Eisenturm was the most pretentious of the five. All they did was follow along the progress of the outside world, but they acted as if they were the only ones who could do it. It was a pleasure seeing their tower in flames."
 ZSP_start_events.6.a: "Arrogance leads to fall."

 ZSP_start_events.7.t: "My Name is Ozymandias, King of Kings"
 ZSP_start_events.7.desc: "As I took my rightful place on the Purple Throne in the Great Temple of the Golden Compass, all I could think of was my next step. How could I enjoy my victory when I was still surrounded by my enemies?"
 ZSP_start_events.7.a: "Look on my works, ye Mighty, and despair!"

 ZSP_phoenix_events.1.t: "The Phoenix"
 ZSP_phoenix_events.1.desc: "It has come to my attention that I have made a mistake. During my extermination of the Sternwarte, I missed one of the disciples. I was informed of this by one of the townsfolk who were in the experimentation hall. Apparently, this disciple has taken up the moniker 'Phoenix' as a sign that he rose from the ashes of the fire I started."
 ZSP_phoenix_events.1.a: "Ashes to ashes, you will fail."


 ZSP_news_events.1.t: "Shadow Incursion into Gardenia"
 ZSP_news_events.1.desc: "The Alstroemerian Magocracy - now named the Realm of Shadows - under leadership of the Sorcerer Ozymandias has launched an invasion of Gardenia with the supposed goal of 'restoring' rightful control over the region."
 ZSP_news_events.1.desc_no_cw: "Fragile peace in Gardenia has been interrupted with the beginning of an incursion from the Alstroemerian region.\n \n$ZSP_news_events.1.desc$"
 ZSP_news_events.1.desc_cw: "The Gardenian Civil War has been disrupted with the beginning of an incursion from the Alstroemerian region.\n \n$ZSP_news_events.1.desc$"
 ZSP_news_events.1.a: "Fall before the Might of Ozymandias!"
 ZSP_news_events.1.b: "Get into defensive positions!"
 ZSP_news_events.1.c: "Great. More power-hungry lunatics."


