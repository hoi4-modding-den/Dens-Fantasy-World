 ZSQ_two_tiered_society: "Two-Tiered Society"
 ZSQ_two_tiered_society_desc: "\n\n\n\n\n\n£GFX_ZSQ_two_tiered_society_embed \n\n\n\n\n\n\nModern societies prefer not to see mass slavery, swathes of people born into servitude with no identity of their own and treated as if they're less than a person. They ignore how readily nations sacrifice social progress to keep pace with rivals, convincing themselves that such injustices are distant, contained, and (most importantly) not their concern. After all, why would somebody complain about a society that benefits them? Why sacrifice what you have for other people? \n\nWell, if you need to look for a society that doesn't value every sentient life, look no further than Rio Azul, a nation with both the highest living standards and the lowest, a nation built on the backs of those born only to be crushed beneath it. It is a grossly inefficient system, one that has been decaying for decades, yet the Council of Tides and the general upper class consider the concept of Rights as a zero-sum game - if the humans are to be given more Rights, what is being taken from us? \n\nMany of those in the middle class know this system cannot last; an army and industry built on the backs of human slaves cannot endure indefinitely. The pressure is mounting and the outcome grows ever more certain. Whether it comes as reform from above or upheaval from below, Rio Azul is heading toward a breaking point from which it will not easily recover."
 
