 ZSQ_DEF: "the Rio Azul"
 ZSQ_ADJ: "Azuliar"
 ZSQ_john_squilliam: "John Squilliam"
 ZSQ_john_squilliam_desc: "John Squilliam (born 1 July 1836) is the leader of the Council of Tides, a select group drawn from the highest strata of squid society. He has spent his entire life within this narrow circle, raised among figures as close to royalty as his culture permits. The son of Afonso and Margarida Squilliam, he has rarely strayed beyond the lofty confines of Ockcester, save for the occasional hunting excursion to the southern reaches of Douroterra; the world he governs is distant from him, far below, both in place and in understanding. \n\nThe lives of the vast majority are not merely unknown to Squilliam; they are unconsidered and ultimately irrelevant within the sphere he inhabits. The nation he leads was built by those he will never meet, and sustained by conditions he will never witness. Surrounded by advisors who share his vantage point high above the streets, there is little to challenge the quiet assumption that this order is stable, even natural. \n\nAs his 100th birthday approaches (a moment of great cultural significance) Squilliam continues as he always has, insulated within the calm of his elevated world. Yet far beneath the polished halls and distant skyline, tension gathers and spreads like, what he'd regard as, a disease. The foundations of Rio Azul strain under pressures its leader neither feels nor perceives, even as they draw ever closer to giving way."

