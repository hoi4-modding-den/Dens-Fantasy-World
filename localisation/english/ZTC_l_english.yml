l_english:

 ZTC_GATHERING_STORM_DESC: "The Free and Mercantile City of Hortensia has been trapped in a decade of stagnation ever since the Hortensian Defenestration, where one of the councilmembers was thrown through the window of his mansion by a rebelling servant, leading to severe repressions against the working class being enacted by the Stadtrat.\n \nBut the stagnation seems to soon come to an end as Grand Councillor Jan Krösus has fallen ill and is expected to die. The appointment of his successor will surely lead Hortensia into another prosperous era."

