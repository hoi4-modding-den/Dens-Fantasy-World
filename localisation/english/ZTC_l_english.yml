# EVENTS

 ZTC_events.1.t: "The Last Session"
 ZTC_events.1.desc: "The age of our chancellor is becoming ever clearer as today's council session had to be cut short as Grand Councillor Krösus had a fit of coughing during his speech and had to be escorted out. Even worse is that the current fractured state of the council requires the grand chancellor to be a rallying point for the remaining loyal moderates, which he certainly is not."
 ZTC_events.1.a: "At this point its probably better he drops dead."

 ZTC_events.2.t: "The Grand Councillor is dead!"
 ZTC_events.2.desc: "A message most unsurprising has been passed to the councilmembers. The inevitable - and awaited by some - death of Grand Councillor Jan Krösus has occured. The 74-year-old man passed away on the [?global.date.GetDateStringNoHourLong], at 4 o'clock. His successor, as per law, will be revealed by his notary in exactly fourteen days, during which the council will be in recess and refrain from making any political choices except in situations of intranational emergency."
 ZTC_events.2.a: "What... now?"

 ZTC_events.3.t: "The Successor Revealed"
 ZTC_events.3.desc: "The councilmembers strode in slow steps along the notary towards the council chambers where the new Grand Councillor would be revealed. Once inside and seated, the notary began reading the will of the late Grand Councillor Jan Krösus, the councillors eagerly awaiting the reveal of who the new Grand Councillor would be. When the name was about to be revealed, the chambers went silent."
 ZTC_events.3.a: "'The role of Grand Councillor will be succeeded by... Franziska Krösus.'"

 ZTC_events.4.t: "The Path of Reform"
 ZTC_events.4.desc: "It is obvious that Hortensia is in dire need of reform. However, too much reform may upset the councilmembers who have entrenched themselves in the traditional system of the city. On th other hand, they could be a useful way to gain power, even if relying too heavily on them will certainly upset the common citizen."
 ZTC_events.4.a: "We must tread carefully."

 ZTC_events.5.t: "[FROM.GetNameDefCap] offers Weapons"
 ZTC_events.5.desc: "WIP"
 ZTC_events.5.a: "We need as many as we can!"
 ZTC_events.5.b: "No thanks."
 
 ZTC_events.6.t: "[FROM.GetAdjective] Deal accepted"
 ZTC_events.6.desc: "WIP"
 ZTC_events.6.a: "Profitable."

 ZTC_events.7.t: "[FROM.GetAdjective] Deal rejected"
 ZTC_events.7.desc: "WIP"
 ZTC_events.7.a: "Too bad."

 ZTC_events.8.t: "The Second Hortensian Defenestration"
 ZTC_events.8.desc: "WIP"
 ZTC_events.8.a: "Long live the People!"

 ZTC_events.9.t: "Stadtrat Motion of No Confidence"
 ZTC_events.9.desc: "WIP"
 ZTC_events.9.a: "It's just business."

 ZTC_events.10.t: "Successful Intervention!"
 ZTC_events.10.desc: "Our Intervention Corps is returning from another successful mission! They bring with them the spoils of war."
 ZTC_events.10.a: "War is the best business opportunity."

 ZTC_events.11.t: "Organisation of the Intervention Force"
 ZTC_events.11.desc: "The Edelweiss Revolution is still ongoing in Gardenia, leaving us as an observer country. Various factions within the Stadtrat have now successfully pushed for the establishment of an intervention force to put an end to the bloodshed so that peace and trade can resume."
 ZTC_events.11.a: "Let's restore peace!"

 ZTC_events.12.t: "Questions of Ideology"
 ZTC_events.12.desc: "The SPH is torn between many different ideological currents. What should be our primary ideological guidance for now?"
 ZTC_events.12.a: "Centre Marxism"
 ZTC_events.12.b: "Ethical Socialism"
 ZTC_events.12.c: "Populist Socialism"

 ZTC_events.13.t: "Hortensians negotiate Security Guarantee"
 ZTC_events.13.desc: "WIP"
 ZTC_events.13.a: "They are under our protection."

 ZTC_events.14.t: "Hortensian Military Pact Proposal"
 ZTC_events.14.desc: "WIP"
 ZTC_events.14.a: "Gardenia stands united."

 ZTC_events.15.t: "Formation of the Gardenian Monetary Union"
 ZTC_events.15.desc: "WIP"
 ZTC_events.15.a: "This will further economic integration."

 ZTC_events.16.t: "Establishment of the Celandra Coastal Protectorate"
 ZTC_events.16.desc: "WIP"
 ZTC_events.16.a: "We cannot refuse."
 ZTC_events.16.b: "Over our dead bodies!"

 ZTC_events.17.t: "Celandra Coastal Protectorate established"
 ZTC_events.17.desc: "WIP"
 ZTC_events.17.a: "Perfekt."

 ZTC_events.18.t: "[FROM.GetNameDefCap] prevents the Operation"
 ZTC_events.18.desc: "WIP"
 ZTC_events.18.a: "Verflucht."

 ZTC_events.19.t: "Hortensian Referendum on Unification"
 ZTC_events.19.desc: "In a surprising turn of events, our Hortensian comrades have voted to unite their nation with ours, officially turning Hortensia into a federal state of our Republic. Naturally, our people are overjoyed that we have managed to peacefully unite the Gardenian region without more bloodshed."
 ZTC_events.19.a: "Wilkommen, Genossen!"

 ZTC_events.20.t: "Against Imperialist Expansionism"
 ZTC_events.20.desc: "WIP"
 ZTC_events.20.a: "Come, Comrades, unite!"

 ZTC_events.21.t: "Dissolution of the City Council"
 ZTC_events.21.desc: "WIP"
 ZTC_events.21.a: "Finally a real democracy!"


 ZTC_news_events.1.t: "The Death of Grand Councillor Krösus"
 ZTC_news_events.1.desc: "Grand Chancellor Krösus, who led Hortensia for the last three decades has passed away yesterday. He died from old age after a long life in politics. His rule was characterised by stagnation, though Hortensia itself remained prosperous. The City Council holds power until his successor is appointed in a few days, with many wondering who possibly could be his appointee."
 ZTC_news_events.1.a: "The winds of change blow through Hortensia."

 ZTC_news_events.2.t: "Popular Revolt in Hortensia"
 ZTC_news_events.2.desc: "WIP"
 ZTC_news_events.2.a: "Arise, ye workers from your slumber!"
 ZTC_news_events.2.b: "The southern trade hub has fallen."

 ZTC_news_events.3.t: "Corporate Coup in Hortensia"
 ZTC_news_events.3.desc: "WIP"
 ZTC_news_events.3.a: "What's on the agenda now?"
 ZTC_news_events.3.b: "Let's just hope they remain amicable."


