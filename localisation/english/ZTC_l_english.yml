 ZTC_the_new_grand_councillor: "The Last Days"
 ZTC_the_new_grand_councillor_desc: ""
 ZTC_the_new_grand_councillor_tt: "§YGrand Councillor Jan Krösus§! is on his deathbed. His appointed successor will be announced shortly following his §Rdeath§!.\n \n \n§LThe situation of Hortensia is rapidly worsening and the council is preparing to forego their democratic traditions for the sake of profit and stability.\n \nThe people of Hortensia fear the continuing stagnation and rally around the radical agitators in hopes of improving their meagre lifes.\n \nThe position of Grand Councillor was never so unwanted.§!"

