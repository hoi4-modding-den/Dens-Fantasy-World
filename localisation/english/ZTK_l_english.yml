ZTK_intro_focus_1: "14 Bloody Great Years"
ZTK_intro_focus_1_desc: "14 years have passed since the 'Bloody Great' Revolution commenced when the previous rump government was ousted. In that time the People’s Collective Union have consolidated their power beneath our great chairman Pigozosye. To another glorious 14 years!"
ZTK_intro_focus_2: "The Hearts and the Minds"
ZTK_intro_focus_2_desc: "Despite our triumphant victory against capitalism, much of our population still toil and live unmindful of this feat. To them, there is stark little difference in the change of whom leads them. To bring about revolution all facets of society must be uplifted and brought into the new age - whether they would like to be or not!"
ZTK_intro_focus_3: "The Prodigal Children"
ZTK_intro_focus_3_desc: "Pigozosye is the father of Tamarkhuran Communalism and to all sons and daughters of the revolution! However he also does have children; a fact he very much is reserved over discussing. Unfortunately his children unfortunately lack the same fire and heroic traits."

ZTK_pacify_the_countryside_1: "Pacify the Countryside"
ZTK_pacify_the_countryside_1_desc: "Tamakhuria is a vast country. From the craggy hills of the West-Downs to the ice-cold crevasses of Trappers Wharf, all the way to the smog-choked urban streets of Ekaterinport. From every hovel and shack to major centre of living, all must know the riches which Communalism shall bring about!"
ZTK_pacify_the_countryside_2: "Industrial Dockyards"
ZTK_pacify_the_countryside_2_desc: "Major naval ports must be restructured to meet the needs for our growing maritime might."
ZTK_pacify_the_countryside_3: "Elevate Locomotive Travel"
ZTK_pacify_the_countryside_3_desc: "A modern state requires a modern railway system. Not just ferrying cargo, but people too. Proper infrastructure is key to connecting our nation together."
ZTK_pacify_the_countryside_4: "Expand [41.GetName] Extraction Operations"
ZTK_pacify_the_countryside_4_desc: "Coal mining forms a vital backbone for our mighty industry. Tamakhuran mineral extraction is highly-centralized, and deeply embedded into local political affairs and economies. Whole entire 'mining towns' exist solely because of this labor alone."
ZTK_pacify_the_countryside_4A: "Develop [106.GetName] Extractions"
ZTK_pacify_the_countryside_4A_desc: "[106.GetName] possesses extensive deposits of rare minerals which have yet to properly make use of and are ripe for extraction."
ZTK_pacify_the_countryside_4B: "Resource Cooperatives"
ZTK_pacify_the_countryside_4B_desc: "Major economic and industrial concerns commonly congregrate together beneath the banner of Tamakhuran to discuss how to fully ensure economic prosperity and the committment to productive quotas. Through developing key strategic industries, this will form an impenetrable backbone which will uplift other sectors of our industry."
ZTK_pacify_the_countryside_4C: "Iliteracy is the Enemy of the State!"
ZTK_pacify_the_countryside_4C_desc: "Education is instrumental to all facets of daily life. Social programs are to be implemented to bring literacy rates up throughought the nation. Specialized program carriages will be dispatched to far-off regions in the hopes to teach the disparate population how to read or write."
