ZTK_armchair_intellectualism: "Armchair Intellectualism"
ZTK_armchair_intellectualism_desc: "While much of the previous landed aristocracy were ousted during the 'Bloody Great' years of the revolution, much of the upper-crust bourgeoisie obstinately remained. Whilst feverently loyal to the regieme, their power and ownership of the vast majority of industries makes it difficult to fully put revolutionist thought into action."
ZTK_poor_infrastructure: "Poor Infrastructure"
ZTK_poor_infrastructure_desc: "The idiom 'working at a freight forwarders pace' is commonly espoused by Tamakhan society. Given the vast distances which is needed to be traversed, logistics networks have the unsavory reputation of being inefficient and slow."
ZTK_rural_society: "Rural Society"
ZTK_rural_society_desc: "Although Tamakh society is by no means technologically backwards, a combination of lacking specialized educational and technical facilities with a largely agarian society has hampered technical advances."
ZTK_oh_i_wish_to_be_a_bird: "Flying Zeigeist"
ZTK_oh_i_wish_to_be_a_bird_desc: "Ever since the world aviation exhibit of 1934, the whole of Tamakhan society has been seized by the desire to fly. What once was out of the realms of possibility now seems to be just in hands reach."



ZTK_focus_1: "14 Bloody Great Years"
ZTK_focus_1_desc: "14 years have passed since the 'Bloody Great' Revolution commenced when the previous rump government was ousted. In that time the People’s Collective Union have consolidated their power beneath our great chairman Pigozosye. To another glorious year!"