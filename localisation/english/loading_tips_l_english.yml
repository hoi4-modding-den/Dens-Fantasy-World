l_english:
 LOADING_TIP_0: "The republican insurrectionists have attempted to separate you from your king and failed. Rest assured that the Zinnian Throne is eternal and no force other than the Creator will destroy it.\n- Michael Aurus III."
 LOADING_TIP_1: "I don't think father knew what he was doing when he appointed me his successor.\n- Franziska Krösus, shortly before the Second Hortensian Defenestration"
 LOADING_TIP_2: "Remember that the bourgeois are not human.\n- Gustav Mai"
 LOADING_TIP_3: "I believe in mercy. Execution will turn him into a martyrer. Exile will turn him into a rallying point. Let him be the proof that the Revolution loves all of its children.\n- Roland Ludovik, on the fate of King Aurus"
 LOADING_TIP_4: "Gardenia will restore the natural order of the world.\n- Yvonne von Karmesin"
 LOADING_TIP_5: "Your foolish king can't save you now.\n- Peter von Tretschau, to von Stegehoff before his death"
